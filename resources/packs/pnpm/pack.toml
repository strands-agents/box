# pnpm, run by the node of @box/node: from npm's global folder, Homebrew, or a Corepack shim.
[pack]
name = "@box/pnpm"
version = 1
kind = "tool"
extend = ["@box/node"]
include = ["@box/node"]

[inputs.pnpm.path]
description = "The pnpm program."
type = "program"
program = "pnpm"
search = [{ env = "PATH" }]

[run]
command = ["${{ inputs.pnpm.path }}"]
# A package's .bin shim runs dirname, sed, and uname.
helpers = ["node", "dirname", "sed", "uname"]
hosts = ["registry.npmjs.org"]

[env]
npm_config_store_dir = "${{ cache }}/store"
npm_config_cache_dir = "${{ cache }}/cache"
npm_config_state_dir = "${{ cache }}/state"
npm_config_update_notifier = "false"
# pnpm 11 and later read only the PNPM_CONFIG_* names.
PNPM_CONFIG_STORE_DIR = "${{ cache }}/store"
PNPM_CONFIG_CACHE_DIR = "${{ cache }}/cache"
PNPM_CONFIG_STATE_DIR = "${{ cache }}/state"
PNPM_HOME = "${{ cache }}/home"
COREPACK_HOME = "${{ cache }}/corepack"
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
XDG_RUNTIME_DIR = "${{ cache }}"

[filesystem]
# pnpm's own program file and package, not the folder that holds them. pnpm's standalone installer
# puts pnpm in PNPM_HOME, which also holds the host's pnpm store and global packages, and whose
# parent is ~/Library or ~/.local/share.
read = ["${{ root.parent }}/dist"]
# node resolves `localhost` from the hosts file. A native pnpm runs node as a helper, so node gets
# this tool's grants.
read_file = [
    "${{ root }}/pnpm",
    "${{ root }}/pnpm.cjs",
    "${{ root }}/pnpm.mjs",
    "${{ root.parent }}/package.json",
    { path = "/private/etc/hosts", when = "macos" },
    { path = "/etc/hosts", when = "linux" },
]
