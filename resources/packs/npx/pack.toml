# The npx tool and MCP launcher requirements.
# MCP compatibility on macOS arm64:
# Pass: npm 10.9.7 / Node 22.22.2; npm 10.9.9 / Node 22.23.4 (oldest LTS line).
# Pass: npm 11.19.1 / Node 22.16.0.
# Fail: npm 11.19.1 / Node 22.22.2 or 24.22.1; npm 12.2.1 / Node 24.22.1.
# Target, untested: npm 11.20.0 or 12.2.1 / Node 26.13.0.
# MCP compatibility on Linux aarch64:
# Pass: bundled npm 10.9.7 / Node 22.22.2; 11.19.1 / Node 24.22.1; 11.20.0 / Node 26.12.1
# and 26.13.1.
# Fail: npm 10.9.7, 11.19.1, 11.20.0, 12.2.1, and 12.2.3 in a separate npm prefix / Node 22.22.2,
# 24.22.1, and 26.13.1.
# Test scope and fixtures: docs/dev/engine-tests.md, Launcher tests.
[pack]
name = "@box/npx"
version = 1
kind = "tool"
extend = ["@box/node"]
include = ["@box/node"]

[inputs.npx.path]
description = "The npx program."
type = "program"
program = "npx"
search = [{ env = "PATH" }]

[run]
command = ["${{ inputs.npx.path }}"]
hosts = ["registry.npmjs.org"]

[env]
npm_config_cache = "${{ cache }}"
npm_config_update_notifier = "false"
# npm's script shell, by its full path. npm keeps its package PATH, and the shell does not depend on
# a search through ancestor folders that the box cannot read.
npm_config_script_shell = "/bin/sh"

[filesystem]
read = ["${{ root.parent }}"]
# npm runs a package's bin through npm_config_script_shell, so npx needs that shell.
read_file = ["/bin/sh"]
