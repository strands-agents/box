# A claude.ai subscription as Claude Code's model provider, with claude.host = "anthropic".
[pack]
name = "@box/claude-subscription"
version = 1
kind = "support"

# The box adds the token from `claude setup-token` to each request to Anthropic's host. The agent
# gets a stand-in value that starts with sk-ant-oat01-, like a setup token. Claude Code calls some
# paths on this host with no token: WebFetch's safety check (/api/web/domain_info), telemetry, and
# /api/directory/server-urls. Under the default inject = "phantom", the gateway refuses each of
# them. With "always", the token goes on every request to api.anthropic.com, so no path list has
# to follow Claude Code's releases. The cost is the stand-in check on this host: the box does not
# prove that a request came from the agent's own binding, and Box Core warns for each request that
# carries no stand-in. The token still reaches only api.anthropic.com
# (docs/design/decisions.md#a-route-may-set-the-phantom-check-to-advisory). @box/anthropic routes
# the same host, so a profile lists one of the two.
[egress.anthropic-subscription]
destinations = ["api.anthropic.com"]
secret.ref = "env://CLAUDE_CODE_OAUTH_TOKEN"
secret.phantom_prefix = "sk-ant-oat01-"
secret.inject = "always"
