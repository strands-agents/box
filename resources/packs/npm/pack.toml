# npm, run by the node of @box/node.
[pack]
name = "@box/npm"
version = 1
kind = "tool"
extend = ["@box/node"]
include = ["@box/node"]

[inputs.npm.path]
description = "The npm program."
type = "program"
program = "npm"
search = [{ env = "PATH" }]

[run]
command = ["${{ inputs.npm.path }}"]
installation = ["npm", "homebrew"]
hosts = ["registry.npmjs.org"]

[env]
# npm's cache is in the tool's own storage, outside the project, so the agent cannot change a
# package that a later install unpacks. Every project of the profile shares it, as ~/.npm is
# shared outside the box.
npm_config_cache = "${{ storage.cache }}"
npm_config_update_notifier = "false"
npm_config_audit = "false"
npm_config_fund = "false"

# The tool's own storage: the agent gets no grant to it.
[storage]
directories = ["cache"]

[filesystem]
read = ["${{ storage.cache }}"]
write = ["${{ storage.cache }}"]
