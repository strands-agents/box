# Kiro CLI in a box, tested with kiro-cli 3.5.0 on macOS, and its powers with 3.4.0. kiro.sign-in
# picks a login inside the box or a Kiro API key. Only Kiro's V3 engine is supported, not `--v2`.
# kiro.import-mcp brings in the MCP servers of your ~/.kiro/settings/mcp.json, and your powers'
# MCP servers stay out. kiro.import-memory reads the memory layout of kiro-cli 3.4.0 and 3.5.0.
[pack]
name = "@box/kiro"
version = 1
kind = "agent"
extend = ["@box/base"]

[run]
# --v3: a headless run, or a host's saved chat.agentEngine, would otherwise pick V2. Kiro's trust
# switch is an option of `chat` only, so with agent.skip-permissions on, the agent arguments go to
# `chat`.
command = [
    "${{ inputs.kiro.path }}",
    "--v3",
    { value = "chat", when = { variable = "inputs.agent.skip-permissions", equals = "true" } },
    { value = "--trust-all-tools", when = { variable = "inputs.agent.skip-permissions", equals = "true" } },
    { slot = "agent-args" },
]

# Kiro's installer puts kiro-cli in ~/.local/bin.
[inputs.kiro.path]
description = "The Kiro CLI program."
type = "program"
program = "kiro-cli"
search = [{ env = "PATH" }, "${{ home }}/.local/bin"]

[inputs.agent.skip-permissions]
description = "Start Kiro CLI's chat with --trust-all-tools, so it runs each tool without asking. The box still allows or refuses each action."
type = "bool"
default = false

# Kiro reads dark mode from macOS through /bin/sh, which the box does not let it run, so it falls
# back to light. KIRO_TERMINAL_THEME skips the check.
[inputs.kiro.theme]
description = "Kiro CLI's color theme. Set light for a light terminal."
from = "env:KIRO_TERMINAL_THEME"
values = ["dark", "light"]
default = "dark"

# Kiro unpacks node, bun, and its agent server, then runs them. In storage the box cannot run them
# (docs/design/cli/decisions.md#a-run-cannot-write-what-a-later-run-trusts), so Kiro reads them from a
# folder on the host that the box cannot write. The operator fills it on the host:
# KIRO_RUNTIME_DIR=~/.kiro-runtime kiro-cli --v3 chat --list-sessions
# Not in ~/.kiro: the box grants no part of the agent's own folder
# (docs/design/cli/decisions.md#an-agent-gets-a-private-configuration-folder).
[inputs.kiro.runtime]
description = "The folder that holds Kiro CLI's unpacked runtime. The box reads it and cannot change it, so fill it on your machine first, and again after each Kiro update."
from = "env:KIRO_RUNTIME_DIR"
default = "${{ home }}/.kiro-runtime"

# A power's mcp.json names programs that Kiro starts, and its env and headers can hold keys. The
# box's checks of MCP servers ([[mcp-servers]]) read one file at a known key, not a folder of
# powers, so the copy leaves each mcp.json out until that import can route a power's servers.
[inputs.kiro.import-powers]
description = "Copy and update your installed Kiro powers in ~/.kiro/powers in the box: each power's POWER.md or plugin.json, steering, and skills. Each power's MCP servers stay out."
type = "bool"
default = false
warning = """Choosing true lets the agent read each power's POWER.md or plugin.json, steering, and skills, as it reads your own steering.
Each power's mcp.json stays out, so a power's MCP servers do not start in the box."""

[inputs.kiro.import-mcp]
description = "Import your MCP servers from ~/.kiro/settings/mcp.json?"
type = "bool"
default = false
warning = """Includes servers you add later.
Local servers run in the box with keys from their settings and your environment.
Remote servers' hosts become reachable.
Copied settings can expose keys to the agent, even for servers Box skips."""

# Your MCP servers. box declares each one the box can run, and lists each one it skips. Kiro CLI
# 3.5.0 fills in ${NAME} in command, args, and env, and passes $NAME and ${env:NAME} as text.
# A server with disabled = true is skipped. autoApprove and timeout pass through. A project's
# .kiro/settings/mcp.json stays out.
[[mcp-servers]]
file = "${{ home }}/.kiro/settings/mcp.json"
kind = "json"
target = "home/.kiro/settings/mcp.json"
target-key = "mcpServers"
key = ["mcpServers"]
env-var-locations = { command = "references", args = "references", env = "references", headers = "header-references" }
env-var-syntax = "${NAME}"
when = { variable = "inputs.kiro.import-mcp", equals = "true" }

[inputs.kiro.sign-in]
description = "How Kiro CLI signs in: login inside the box, or api-key from KIRO_API_KEY."
type = "string"
values = ["login", "api-key"]
default = "login"

# Off by default: Kiro keeps the memories of every project in one database, so the box gets all
# of them, not only this project's.
[inputs.kiro.import-memory]
description = "Copy Kiro CLI's memory into the box once, on the profile's first run."
type = "bool"
default = false
warning = """The box gets every memory Kiro CLI keeps on this machine: your Global memories, each project's memories, and anything you told Kiro to remember.
Box copies them once, on the profile's first run, and writes nothing back to your machine."""

# ~/.strands/box/storage/<profile>/default/agent/, shared by every project the profile runs in. With HOME
# here, Kiro keeps its settings, its sessions, and a login made in the box in storage.
[storage]
directories = ["home", "tmp"]

# What the box does, and the profile to change (docs/design/cli/decisions.md#an-agent-pack-tells-its-agent-about-the-box).
# Kiro reads each file below .kiro/steering, so the guidance and your own steering are two copies
# side by side. The env BOX_PROFILE names the profile.
[[storage.files]]
source = "${{ pack }}/box.md"
target = "home/.kiro/steering/box.md"
sync = true

# Your own instructions, skills, prompts, and agents, copied into storage on the profile's first
# run and brought up to date with the host on each run after it. A box's edit stays until the
# host's file changes.
[[storage.files]]
source = "${{ home }}/.kiro/steering"
target = "home/.kiro/steering/host"
optional = true
sync = true

[[storage.files]]
source = "${{ home }}/.kiro/skills"
target = "home/.kiro/skills"
optional = true
sync = true

[[storage.files]]
source = "${{ home }}/.kiro/prompts"
target = "home/.kiro/prompts"
optional = true
sync = true

# Kiro's memory, copied on the profile's first run only. No sync: the box adds its own memories,
# and a host copy would replace them. Each folder holds a live SQLite database with its -wal and
# -shm files, and box copies a folder only when none of its files changed during the copy.
# Without a login, or with an API key, Kiro reads the shared memories/. With a login, it reads
# identities/<hash of the user>/memories/, and fills it from memories/ the first time. Under
# identities/, Kiro writes only that folder and settings/kiro-agent.json, which holds the memory
# settings and Kiro's own migrations.
[[storage.files]]
source = "${{ home }}/.kiro/memories"
target = "home/.kiro/memories"
optional = true
when = { variable = "inputs.kiro.import-memory", equals = "true" }

[[storage.files]]
source = "${{ home }}/.kiro/identities"
target = "home/.kiro/identities"
optional = true
when = { variable = "inputs.kiro.import-memory", equals = "true" }

# Your installed powers. installed.json holds only each power's name: Kiro writes { "name" } for
# each power it installs and reads only the name. Each power's folder comes in without its mcp.json
# (see kiro.import-powers). Not powers/data, which a power's MCP server fills with its own state,
# and not powers/registries, which Kiro CLI does not read.
[[storage.files]]
source = "${{ home }}/.kiro/powers/installed.json"
target = "home/.kiro/powers/installed.json"
optional = true
sync = true
when = { variable = "inputs.kiro.import-powers", equals = "true" }

[[storage.files]]
source = "${{ home }}/.kiro/powers/installed"
target = "home/.kiro/powers/installed"
optional = true
sync = true
exclude = ["mcp.json"]
when = { variable = "inputs.kiro.import-powers", equals = "true" }

# Each agent's file comes in whole, as Claude Code's and Codex's agent folders do. Its `hooks` and
# `mcpServers` come in unchecked: [[storage.hooks]] and [[mcp-servers]] read one file, and Kiro
# keeps one file per agent. Kiro starts a hook through /bin/sh, which the box does not run, so no
# hook runs. A local MCP server runs in the box with its policy, and a remote one's host stays
# closed until a route opens it.
[[storage.files]]
source = "${{ home }}/.kiro/agents"
target = "home/.kiro/agents"
optional = true
sync = true

# Your model and your default agent. Not chat.agentEngine: the command names V3.
[[storage.files]]
source = "${{ home }}/.kiro/settings/cli.json"
target = "home/.kiro/settings/cli.json"
kind = "json"
optional = true
keep = [["chat.defaultModel"], ["chat.enableContextUsageIndicator"], ["chat.defaultAgent"]]

# An update in the box cannot replace the host's kiro-cli.
[[storage.files.set]]
key = ["app.disableAutoupdates"]
value = true

# With --trust-all-tools, Kiro asks at each start to accept the mode. agent.skip-permissions is that
# answer. Without the switch, Kiro never shows the question. A host with no cli.json gets a copy of
# only these set rows.
[[storage.files.set]]
key = ["chat.disableTrustAllConfirmation"]
value = true

# Kiro runs each command through SHELL, and the box's bash sends it through the policy.
# KIRO_NO_AUTO_UPDATE: an update in the box cannot replace the host's kiro-cli.
# KIRO_NO_REMOTE_CHANGELOG: Kiro reads its release news from prod.download.cli.kiro.dev, outside
# Kiro's service.
# Telemetry stays off: once its hosts are open, Kiro's telemetry client panics in the box
# ("Attempted to create a NULL object" in security-framework) at the end of a run.
[env]
HOME = "${{ storage.home }}"
TMPDIR = "${{ storage.tmp }}"
SHELL = "${{ box }}/bin/bash"
KIRO_RUNTIME_DIR = "${{ inputs.kiro.runtime }}"
KIRO_TERMINAL_THEME = "${{ inputs.kiro.theme }}"
KIRO_NO_AUTO_UPDATE = "1"
KIRO_NO_REMOTE_CHANGELOG = "1"
KIRO_DISABLE_TELEMETRY = "1"
KIRO_DISABLE_TOOLKIT_TELEMETRY = "1"
BOX_PROFILE = "${{ profile }}"

[filesystem]
read = [
    "${{ inputs.kiro.path }}",
    "${{ inputs.kiro.runtime }}",
    # The runtime's node loads libstdc++.so.6 from the system's library folders: /usr/lib on Debian
    # and Ubuntu, /usr/lib64 on Amazon Linux, Fedora, and RHEL. An exec grant on node alone would
    # bring in only its own libraries, but a file inside the runtime's exec grant is refused. So the
    # agent reads the four folders, and on Linux it can also run each program in them.
    { path = "/lib", when = "linux" },
    { path = "/usr/lib", when = "linux" },
    { path = "/lib64", optional = true, when = "linux" },
    { path = "/usr/lib64", optional = true, when = "linux" },
]
exec = ["${{ inputs.kiro.path }}", "${{ inputs.kiro.runtime }}"]

# Kiro's service, us-east-1 only: Kiro's other regions are not tested. With login, the sign-in
# service and Kiro's two hosts get no credential, and Kiro keeps its login token in the box's
# storage, where the agent can read it
# (docs/design/cli/decisions.md#a-route-with-only-destinations-opens-a-host).
[egress.kiro-login]
when = { variable = "inputs.kiro.sign-in", equals = "login" }
destinations = [
    "oidc.us-east-1.amazonaws.com",
    "management.us-east-1.kiro.dev",
    "runtime.us-east-1.kiro.dev",
]

# With api-key, the box adds the Kiro API key to each request to both hosts. The agent gets one
# stand-in value that starts with ksk_, like a Kiro API key.
[egress.kiro]
when = { variable = "inputs.kiro.sign-in", equals = "api-key" }
destinations = ["management.us-east-1.kiro.dev", "runtime.us-east-1.kiro.dev"]
secret.ref = "env://KIRO_API_KEY"
secret.phantom_prefix = "ksk_"
