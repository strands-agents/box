[[cell]]
id = "GO-01"
section = "Go"
gate = "first-update"
machine = "clean"
prompt = "Add a /healthz endpoint with a table-driven test to this gin example."
fixture = "clone:gin-gonic/examples"
fixture_ref = "115c869356cd02a84f34f5913bedc75fbee87efa"
needs = ["go"]
net = ["proxy.golang.org", "sum.golang.org"]
pass_check = "go test ./... passes"
note = "A denied ~/Library/Caches/go-build fails go test but not go build. @box/go keeps the build cache, the module cache, and GOPATH in the project. The script adds the endpoint to the basic example, and edits its main.go with bash builtins, as a harness's file edit would."
script = '''
write basic/healthz.go <<'EOF'
package main

import (
	"net/http"

	"github.com/gin-gonic/gin"
)

func healthz(c *gin.Context) {
	c.JSON(http.StatusOK, gin.H{"status": "ok"})
}
EOF
main=""
while IFS= read -r line || [[ -n $line ]]; do
  main+="$line"$'\n'
  if [[ $line == *'router := gin.Default()'* ]]; then main+=$'\trouter.GET("/healthz", healthz)\n'; fi
done < basic/main.go
printf '%s' "$main" > basic/main.go
write basic/healthz_test.go <<'EOF'
package main

import (
	"net/http"
	"net/http/httptest"
	"testing"

	"github.com/stretchr/testify/assert"
)

func TestHealthz(t *testing.T) {
	tests := []struct {
		name   string
		method string
		code   int
		body   string
	}{
		{"get", http.MethodGet, http.StatusOK, `{"status":"ok"}`},
		{"post is not routed", http.MethodPost, http.StatusNotFound, ""},
		{"delete is not routed", http.MethodDelete, http.StatusNotFound, ""},
	}
	router := setupRouter()
	for _, tt := range tests {
		t.Run(tt.name, func(t *testing.T) {
			w := httptest.NewRecorder()
			req, _ := http.NewRequestWithContext(t.Context(), tt.method, "/healthz", nil)
			router.ServeHTTP(w, req)
			assert.Equal(t, tt.code, w.Code)
			if tt.body != "" {
				assert.JSONEq(t, tt.body, w.Body.String())
			}
		})
	}
}
EOF
bash -c 'go test ./...'
'''

