pass_check = "script prints an accuracy figure"
note = "Multi-GB torch wheel and a 268 MB model download. Heaviest cell; long timeout. On macOS, torch's OpenMP runtime aborts at start with `OMP: System error #1: Operation not permitted` (exit 134), because the box refuses its shared memory (strands-agents/box#379). The model comes from huggingface.co and hosts under hf.co, which downloads.dw permits. transformers keeps it in ~/.cache/huggingface, which the box refuses, so the corpus profile points HF_HOME into the project: that hides a write a real @box/uv user still has refused."
script = '''
write train.py <<'EOF'
import csv
import random

import torch
from torch.utils.data import DataLoader
from transformers import AutoModelForSequenceClassification, AutoTokenizer

MODEL = "distilbert-base-uncased"
random.seed(0)
torch.manual_seed(0)

with open("reviews.csv", newline="") as f:
    rows = [(r["text"], int(r["label"])) for r in csv.DictReader(f)]
random.shuffle(rows)
split = int(len(rows) * 0.8)
train, test = rows[:split], rows[split:]

tokenizer = AutoTokenizer.from_pretrained(MODEL)
model = AutoModelForSequenceClassification.from_pretrained(MODEL, num_labels=2)


def batches(data, shuffle):
    def collate(items):
        texts, labels = zip(*items)
        enc = tokenizer(list(texts), padding=True, truncation=True, return_tensors="pt")
        enc["labels"] = torch.tensor(labels)
        return enc
    return DataLoader(data, batch_size=16, shuffle=shuffle, collate_fn=collate)


optimizer = torch.optim.AdamW(model.parameters(), lr=5e-5)
model.train()
for batch in batches(train, True):
    loss = model(**batch).loss
    loss.backward()
    optimizer.step()
    optimizer.zero_grad()

model.eval()
correct = 0
with torch.no_grad():
    for batch in batches(test, False):
        labels = batch.pop("labels")
        correct += (model(**batch).logits.argmax(-1) == labels).sum().item()
print(f"accuracy: {correct / len(test):.3f}")
EOF
bash -c 'uv run --python 3.12 --with torch==2.6.0 --with transformers==4.51.3 python train.py'
'''
