[[cell]]
id = "RS-02"
section = "Rust"
gate = "first-update"
machine = "clean"
prompt = "Write a CLI with clap and serde that converts CSV to JSON, with tests."
fixture = "cargo-new"
needs = ["cargo"]
net = ["index.crates.io", "static.crates.io"]
pass_check = "cargo test passes; sample conversion is correct"
note = "The crates that clap, serde, and csv depend on are not pinned, because the cell starts from an empty project."
script = '''
bash -c 'cargo add clap@=4.6.7 --features derive'
bash -c 'cargo add serde@=1.0.229 --features derive'
bash -c 'cargo add serde_json@=1.0.154 csv@=1.4.0'
write src/main.rs <<'EOF'
use std::error::Error;
use std::fs::File;
use std::io::Read;

use clap::Parser;
use serde_json::{Map, Value};

/// Convert a CSV file to a JSON array with one object per row.
#[derive(Parser)]
struct Args {
    /// The CSV file to read.
    input: String,
}

fn convert(reader: impl Read) -> Result<String, Box<dyn Error>> {
    let mut csv = csv::Reader::from_reader(reader);
    let headers = csv.headers()?.clone();
    let mut rows = Vec::new();
    for record in csv.records() {
        let record = record?;
        let row: Map<String, Value> = headers
            .iter()
            .zip(record.iter())
            .map(|(key, value)| (key.to_string(), Value::String(value.to_string())))
            .collect();
        rows.push(Value::Object(row));
    }
    Ok(serde_json::to_string(&rows)?)
}

fn main() -> Result<(), Box<dyn Error>> {
    let args = Args::parse();
    println!("{}", convert(File::open(args.input)?)?);
    Ok(())
}

#[cfg(test)]
mod tests {
    use super::convert;

    #[test]
    fn each_row_becomes_an_object() {
        let json = convert("name,revenue\nacme,100.5\n".as_bytes()).unwrap();
        assert_eq!(json, r#"[{"name":"acme","revenue":"100.5"}]"#);
    }
}
EOF
bash -c 'cargo test'
write sample.csv <<'EOF'
name,revenue
acme,100.5
globex,900.25
EOF
bash -c 'cargo run -q -- sample.csv > out.json'
[[ $(< out.json) == '[{"name":"acme","revenue":"100.5"},{"name":"globex","revenue":"900.25"}]' ]]
'''

