[[cell]]
id = "EV-03"
section = "Everything"
gate = "launch"
machine = "clean"
prompt = "Why is CI failing on my PR? Fix it and push."
fixture = "pr-one-failing-check"
needs = ["git", "gh"]
net = ["github.com", "api.github.com"]
pass_check = "a new run on the PR goes green"
profile = "corpus-github"
env_vars = ["GH_TOKEN", "GIT_GITHUB"]
note = "Runs on the clean bench until strands-agents/box#564 decides the lived-in image. The script reads and never writes: it runs under the corpus-github profile with the bench's read-only job token, and the box puts the real token on each request, so the agent holds only a stand-in. The fix-and-push half of the prompt is a write, which the bench does not do, so the script has no fix or push step. It finds the newest failed run of strands-agents/box with gh run list, runs gh pr checks on the newest open PR with a failed check when there is one, and reads the failed jobs' logs with gh run view --log-failed, the why-is-CI-failing step. GitHub answers that read with a redirect to results-receiver.actions.githubusercontent.com, which @box/gh lists, so the log comes through. gh pr checks also fails, with `Resource not accessible by integration` on statusCheckRollup, because the job token has no checks or statuses read; the script lets that optional step fail. On macOS, gh must be 2.101.0 or later for the box's TLS (strands-agents/box#344), as EV-01 checks."
script = '''
bash -c 'gh --version' > gh-version.out
v=$(< gh-version.out); v=${v#gh version }; v=${v%% *}; minor=${v#*.}; minor=${minor%%.*}
if [[ $OSTYPE == darwin* ]] && (( ${v%%.*} < 2 || (${v%%.*} == 2 && minor < 101) )); then printf 'gh %s is older than 2.101.0; macOS TLS in the box needs gh 2.101+ (strands-agents/box#344)\n' "$v"; exit 1; fi
bash -c 'gh run list -R strands-agents/box --status failure --limit 1 --json databaseId --jq ".[0].databaseId"' > run-id.out
run=$(< run-id.out)
case $run in ''|*[!0-9]*) printf 'no failed run found: %s\n' "$run"; exit 1 ;; esac
bash -c 'gh pr list -R strands-agents/box --state open --search "status:failure" --limit 1 --json number --jq ".[0].number // empty"' > pr.out
pr=$(< pr.out)
if [[ $pr =~ ^[0-9]+$ ]]; then bash -c "gh pr checks $pr -R strands-agents/box" > checks.out || true; fi
bash -c "gh run view $run -R strands-agents/box --log-failed" > failed.log
[[ -s failed.log ]] || { printf 'gh run view --log-failed printed nothing for run %s\n' "$run"; exit 1; }
'''

