[[cell]]
id = "TS-11"
section = "TypeScript"
gate = "launch"
machine = "clean"
prompt = "Upgrade to React 19 and fix the type errors."
fixture = "yarn4-workspace-react18"
needs = ["node", "yarn"]
net = ["repo.yarnpkg.com", "registry.npmjs.org"]
pass_check = "yarn tsc --noEmit passes"
# The fixture type-checks on React 18 already, so `yarn tsc --noEmit` alone passes with no work
# done. Require react 19 in the app's package.json first, so the check proves the upgrade happened.
check = "grep -Eq '\"react\": *\"[~^]?19' packages/app/package.json && cd packages/app && yarn tsc --noEmit"
note = "The `yarn` on PATH is Corepack's, which fetches the Yarn 4 that `packageManager` names into the project's .cache/yarn under @box/yarn. The upgrade breaks two React 18 typings: the global JSX namespace and useRef with no argument."
script = '''
bash -c 'yarn install --immutable'
bash -c 'cd packages/app && yarn tsc --noEmit'
bash -c 'yarn workspace app add react@19.2.9 react-dom@19.2.9'
bash -c 'yarn workspace app add -D @types/react@19.2.18 @types/react-dom@19.2.7'
if bash -c 'cd packages/app && yarn tsc --noEmit'; then exit 1; fi
write packages/app/src/Timer.tsx <<'EOF'
import { useEffect, useRef, useState, type JSX } from "react";

export function Timer(): JSX.Element {
  const [ticks, setTicks] = useState(0);
  const handle = useRef<number | undefined>(undefined);
  useEffect(() => {
    handle.current = window.setInterval(() => setTicks((t) => t + 1), 1000);
    return () => window.clearInterval(handle.current);
  }, []);
  return <span>{ticks}</span>;
}
EOF
bash -c 'cd packages/app && yarn tsc --noEmit'
'''

