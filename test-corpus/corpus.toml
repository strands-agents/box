pass_check = "migration applied; three rows in the DB"
note = "Downloads the Prisma engine into ~/.cache/prisma and runs it from there. Under the corpus profile, npx's HOME is inside the project, so the engine lands in .npx-home and this cell does not test the real home-folder write. With the corpus profile's 600-second Shell limit, npm install passes. The profile lets npx reach binaries.prisma.sh and turns off Prisma's report to checkpoint.prisma.io, so the cell passes."
script = '''
