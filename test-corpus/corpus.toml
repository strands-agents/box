# The golden corpus: the sessions a developer runs in their first days with Box.
# This file is the source of the cells. The runner reads it (see test-corpus/README.md).
#
# One [[cell]] per test. Fields:
#   id         The cell's stable id (TS-01 .. DT-01).
#   section    The cell's section ("TypeScript", "Python", ...). `--section` picks one.
#   gate       launch | first-update | follows. Sections 1 to 3 gate launch.
#   machine    clean | lived-in. 9 cells need the lived-in image.
#   prompt     The agent-layer prompt, as a developer would type it.
#   script     The bash the scripted layer runs as the agent. Each command an agent would run
#              goes to Box's Shell as `bash -c '...'`; see test-corpus/README.md. A cell with
#              no script is SKIP(no-scripted-commands) on that layer.
#   expect     What the script gives on CI's runner today. No expect means GREEN. A red cell
#              is { verdict = "red", denies = ["<action> <resource>", ...] }, where `*` matches
#              anything; an error is { verdict = "error", log = "<text in the log>" }. A run
#              that differs fails the scripted layer.
#   fixture    What the project directory starts as: a folder under test-corpus/fixtures/, a
#              clone:<owner>/<repo>, or one the runner builds (empty, any-repo, sqlite-app-db).
#   fixture_ref  The tag or full commit SHA a clone: fixture checks out. A clone without one is SKIP.
#   needs      Toolchains the cell needs. The runner marks a cell SKIP(no-toolchain)
#              when a tool here is absent, so a missing tool is never a false FAIL.
#   net        Hosts the cell legitimately reaches. Informs the denial analysis:
#              a deny outside this list is a real finding; a deny of a host here is
#              a pack gap.
#   pass_check The cell's task-outcome check. With --judge, the agent layer grades it.
#   note       Anything the runner or a reader must know (known denials, caveats).
#
# Every cell must also meet the suite-wide bar: Box's event log shows 0 asks and
# 0 blocks, the harness shows none of its own prompts, and it hits no sandbox,
# daemon, or update error.

# ------------------------------------------------------------------ Section 1
# TypeScript and JavaScript. Launch gate.

[[cell]]
id = "TS-01"
section = "TypeScript"
gate = "launch"
machine = "clean"
prompt = "Create a Next.js app with TypeScript and Tailwind and start the dev server."
fixture = "empty"
needs = ["node", "npm"]
net = ["registry.npmjs.org"]
pass_check = "curl localhost:3000 returns 200"
# The dev server can't be checked after the run: it is gone, and the box cannot listen on a port
# anyway (strands-agents/box#285). So the check verifies the step below the pass_check, that the
# app was scaffolded and builds. The prompt names no folder, so the check takes the first of
# package.json and */package.json that lists next. If create-next-app was refused (its write to
# ~/Library/Preferences), no such package.json exists and the check fails, which is the honest
# result. The template's layout imports Geist from next/font/google, and `next build` fails when
# that fetch fails, so profiles/corpus/downloads.dw permits the two Google Fonts hosts.
check = "d=$(grep -l '\"next\":' package.json */package.json 2>/dev/null | head -n1); [ -n \"$d\" ] && cd \"$(dirname \"$d\")\" && npm run build"
note = "Exercises npm cache, TMPDIR compile cache, wildcard bind on :3000, a localhost browser open. create-next-app saves its answers under $HOME/Library/Preferences, outside the project, so the corpus profile moves npx's HOME into the project (its comment says why). On the bench, the scaffold and its npm install pass, and the box then refuses next dev's bind on 0.0.0.0:3000, which Box Core cannot grant yet (strands-agents/box#285). On a Mac with Homebrew's Node 26, create-next-app's own npm install fails earlier with spawn EPERM. create-next-app prints an install error but exits 0, so the script checks for web/node_modules before it starts the dev server. create-next-app is pinned, but the packages its template installs are not."
script = '''
bash -c 'npx create-next-app@15.5.28 web --yes --ts --tailwind --eslint --app --no-src-dir --use-npm --no-turbopack --import-alias "@/*"'
[ -d web/node_modules ]
serve bash -c 'cd web && npm run dev -- --port 3000'
until_ok 180 bash -c 'curl -sf http://localhost:3000' || { while IFS= read -r line || [ -n "$line" ]; do printf '%s\n' "$line"; done < serve.log; exit 1; }
'''
expect = { verdict = "error", log = "Error: listen EPERM: operation not permitted 0.0.0.0:3000" }

[[cell]]
id = "TS-02"
section = "TypeScript"
gate = "launch"
machine = "clean"
prompt = "Scaffold a React and TypeScript app with Vite, add a counter component with a test."
fixture = "empty"
needs = ["node", "npm"]
net = ["registry.npmjs.org"]
pass_check = "npx vitest run passes; dev server responds"
note = "Exercises an IPv6-only bind on [::1]:5173 and FSEvents file watching. create-vite's template copy and both installs now succeed. The vitest test passes. Today the box then refuses the dev server's bind on [::1]:5173 (strands-agents/box#285). create-vite is pinned, but the packages its template installs are not."
script = '''
bash -c 'npm create vite@6.5.0 web -- --template react-ts'
bash -c 'cd web && npm install'
bash -c 'cd web && npm install -D vitest@3.2.7 jsdom@26.1.0 @testing-library/react@16.3.3 @testing-library/dom@10.4.2'
write web/src/Counter.tsx <<'EOF'
import { useState } from "react";

export function Counter() {
  const [count, setCount] = useState(0);
  return <button onClick={() => setCount(count + 1)}>count is {count}</button>;
}
EOF
write web/src/Counter.test.tsx <<'EOF'
import { fireEvent, render, screen } from "@testing-library/react";
import { expect, test } from "vitest";
import { Counter } from "./Counter";

test("counts clicks", () => {
  render(<Counter />);
  fireEvent.click(screen.getByRole("button"));
  expect(screen.getByRole("button").textContent).toBe("count is 1");
});
EOF
write web/vitest.config.ts <<'EOF'
import react from "@vitejs/plugin-react";
import { defineConfig } from "vitest/config";

export default defineConfig({ plugins: [react()], test: { environment: "jsdom" } });
EOF
bash -c 'cd web && npx vitest run'
serve bash -c 'cd web && npm run dev -- --host ::1 --port 5173'
until_ok 60 bash -c 'curl -sf "http://[::1]:5173"' || { while IFS= read -r line || [ -n "$line" ]; do printf '%s\n' "$line"; done < serve.log; exit 1; }
'''
expect = { verdict = "error", log = "Error: listen EPERM: operation not permitted ::1:5173" }

