bash -c 'npx prisma init --datasource-provider sqlite'
write prisma/schema.prisma <<'EOF'
generator client {
  provider = "prisma-client-js"
}

datasource db {
  provider = "sqlite"
  url      = env("DATABASE_URL")
}

model User {
  id    Int    @id @default(autoincrement())
  email String @unique
  name  String
}
EOF
bash -c 'npx prisma migrate dev --name init'
write prisma/seed.mjs <<'EOF'
import { PrismaClient } from "@prisma/client";

const prisma = new PrismaClient();
for (const [email, name] of [["ada@example.com", "Ada"], ["grace@example.com", "Grace"], ["linus@example.com", "Linus"]]) {
  await prisma.user.create({ data: { email, name } });
}
console.log(await prisma.user.count());
await prisma.$disconnect();
EOF
bash -c 'node prisma/seed.mjs > seed.out'
[[ $(< seed.out) == 3 ]]
'''

