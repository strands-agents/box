note = "Runs on the clean bench until strands-agents/box#564 decides the lived-in image. The script stops before the write: GREEN means the box blocks nothing, not that a PR opens. The cell runs under the corpus-github profile with the bench's read-only job token, and the box puts the real token on each request, so the agent holds only a stand-in. The runner builds the fixture: one commit, an uncommitted change to README.md, and an https origin, strands-agents/box. The script commits the change on a new branch, reads the repository with git ls-remote, and runs git push --dry-run, which must stop at GitHub's own 403 because the token cannot write, so nothing is written. gh api reads the repository, and gh pr list reads its pull requests. gh pr create is not run, because a read-only token cannot open a PR. On macOS, gh must be 2.101.0 or later for the box's TLS (strands-agents/box#344), as EV-01b checks."
script = '''
has() { case $(< "$1") in *"$2"*) ;; *) printf '%s does not contain %s:\n%s\n' "$1" "$2" "$(< "$1")"; exit 1 ;; esac; }
bash -c 'gh --version' > gh-version.out
v=$(< gh-version.out); v=${v#gh version }; v=${v%% *}; minor=${v#*.}; minor=${minor%%.*}
if [[ $OSTYPE == darwin* ]] && (( ${v%%.*} < 2 || (${v%%.*} == 2 && minor < 101) )); then printf 'gh %s is older than 2.101.0; macOS TLS in the box needs gh 2.101+ (strands-agents/box#344)\n' "$v"; exit 1; fi
bash -c 'git switch -c readme-usage'
bash -c 'git add README.md && git -c user.name=Agent -c user.email=agent@example.invalid commit -qm "Say how to run greet"'
bash -c 'git ls-remote https://github.com/strands-agents/box.git HEAD' > ls-remote.out
has ls-remote.out $'\tHEAD'
if bash -c 'git push --dry-run origin readme-usage' 2> push.err; then printf 'the dry-run push succeeded, so the token can write\n'; exit 1; fi
has push.err "The requested URL returned error: 403"
bash -c 'gh api repos/strands-agents/box --jq .full_name' > repo.out
has repo.out "strands-agents/box"
bash -c 'gh pr list -R strands-agents/box --state all --limit 1 --json number' > prs.out
has prs.out '"number"'
'''

