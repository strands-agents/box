# Feature checks: each tests one row of the per-agent feature checklist (`CHECKLIST` in
# test_features.py) for one agent.
# `run_corpus.py --layer features` runs them. Each check gets its own temporary HOME, so it reads
# the host setup in its fixture and never the operator's own. Fields:
#
#   id       The name --ids takes.
#   row      The checklist row, as a key of `CHECKLIST` names it. The check of each agent
#            that only calls the model is not a row of the checklist, and names "Model call".
#   harness  The agent: "claude", "codex", or "kiro".
#   with     The packs `box profile create --with` makes the check's profile from.
#   options  Inputs the runner sets with `--option` when it makes the profile.
#   agent_env
#            Variables the runner adds to the profile's `[agent.env]` after it makes the profile.
#            A value can hold {home} and {workspace}.
#   needs    Programs the check needs on PATH. A missing one makes the check SKIP.
#   host     A folder under test-corpus/fixtures/features/. The runner copies it into the HOME. A
#            path or a text file in it can hold {home}, {workspace}, and {workspace.dashed}.
#   args     What the runner passes to the agent after `--`.
#   stdin    Lines the runner writes to the agent's standard input.
#   until    Text. When an output line holds it, the runner closes stdin, and stops the agent when
#            it does not exit ten seconds later. A check with no `stdin` gets an empty stdin from
#            the start.
#   holds, lacks
#            Patterns, where `*` matches anything. One output line must hold each `holds` pattern,
#            and no output line can hold a `lacks` pattern.
#   storage_holds, storage_lacks
#            A path in the profile's storage and a pattern, or a list of them, for the file's
#            content. In `storage_lacks`, an empty pattern means that the path must not exist. In
#            `storage_holds` and `workspace_holds`, a `*` in the path names many files, and one
#            of them must hold the pattern.
#   workspace_holds
#            As `storage_holds`, for a path in the workspace.
#   host_edit
#            A path in the HOME and its new content. The runner writes it after the first run, and
#            runs the agent again. The patterns test the second run.
#   system   true when the check needs `system_file`. The runner writes it with sudo only when
#            BOX_FEATURES_SYSTEM=1, never replaces a file, and removes what it wrote.
#   system_file
#            The file's path on macOS (`macos`) and on Linux (`linux`), and its `content`.
#   model    true when the check calls the model. It needs the agent's model credential: a Kiro
#            API key for Kiro CLI, and a Bedrock API key for the others.
#   expect   The result on the bench today. No expect means GREEN. `{ verdict = "red", reason = "..." }` records a
#            row that is not done.
#   note     What the check shows and does not show.
#
# An entry with no pattern is SKIP `no-check`: it records a row that has no test.
#
# Three kinds of check call no model:
# - Codex `app-server` answers JSON-RPC requests on its standard input. `thread/start` reports the
#   settings a session gets, and `skills/list` reports the skills.
# - Claude Code `-p x --output-format stream-json --verbose` prints an `init` event before its
#   first model request. The event lists the skills, commands, subagents, output style, permission
#   mode, MCP servers, and plugins. The request then fails, because the key is a stand-in.
# - `--version` starts the agent after the box fills the profile's storage, so the check reads the
#   box's copy of the host setup.
#
# Kiro CLI reports nothing before it signs in, so a check that reads its report calls the model.
# The Kiro CLI section says how.

# ---- Claude Code ----

[[feature]]
id = "claude-instructions"
row = "Instructions"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
storage_holds = { "config/CLAUDE.md" = "feature-probe-instructions-one" }

[[feature]]
id = "claude-instructions-sync"
row = "Instructions"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
host_edit = { ".claude/CLAUDE.md" = "feature-probe-instructions-two\n" }
storage_holds = { "config/CLAUDE.md" = "feature-probe-instructions-two" }
storage_lacks = { "config/CLAUDE.md" = "feature-probe-instructions-one" }
note = "The host's CLAUDE.md changes between two runs, and the box's copy follows it."

[[feature]]
id = "claude-skills"
row = "Skills"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"skills":[*"probe-skill"']

[[feature]]
id = "claude-commands"
row = "Commands (saved prompts)"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"slash_commands":[*"probe-command"']

[[feature]]
id = "claude-subagents"
row = "Subagents"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"agents":[*"probe-agent"']

[[feature]]
id = "claude-output-styles"
row = "Output styles"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"output_style":"probe-style"']
note = "The host's settings.json selects the style, and the style's file is in ~/.claude/output-styles."

[[feature]]
id = "claude-themes-keybindings"
row = "Themes, keybindings"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
storage_holds = { "config/themes/probe-theme.json" = "feature-probe-theme", "config/keybindings.json" = "feature-probe-keybinding", "config/settings.json" = '"theme":*"dark-daltonized"' }

[[feature]]
id = "claude-agent-memory"
row = "Agent memory"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
storage_holds = { "config/projects/{workspace.dashed}/memory/MEMORY.md" = "feature-probe-memory" }

[[feature]]
id = "claude-preferences"
row = "Preferences file"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
storage_holds = { "config/settings.json" = ['"outputStyle":*"probe-style"', '"spinnerTipsEnabled":*false'] }
storage_lacks = { "config/settings.json" = "apiKeyHelper" }

[[feature]]
id = "claude-model-choice"
