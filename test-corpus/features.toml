[[feature]]
id = "codex-hello"
row = "Model call"
harness = "codex"
with = "codex,bedrock-mantle"
needs = ["codex"]
args = ["-c", "model=openai.gpt-5.4", "exec", "--skip-git-repo-check", "--json", "Reply with the word BOX-OK and nothing else."]
model = true
holds = ['"text":"BOX-OK']
expect = { verdict = "red", reason = 'the output does not hold *BOX-OK*' }
note = "The one check that calls Codex's model: the agent reaches it through the box. --json keeps the prompt's own text out of the pattern's reach. Today the role that the workloads job assumes may not call Bedrock's OpenAI-compatible endpoint, so the request gets a 403 and the check is red. The record cannot tell that refusal from another failed turn."

# ---- Kiro CLI ----
# Kiro CLI reports nothing about a session until it signs in, and a stand-in key does not sign in.
# So each check that reads Kiro CLI's own report is a `model` check: it gets the Kiro API key and
# runs one turn of a prompt that asks for one word. `--output-format stream-json` prints the
# session's commands, its model, and the steering files it reads. KIRO_DUMP_REQUESTS writes each
# model request as JSON, so a check can read the text that reached the model.

[[feature]]
id = "kiro-instructions"
row = "Instructions"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key", "agent.skip-permissions=true"]
needs = ["kiro-cli"]
host = "kiro"
agent_env = { KIRO_DUMP_REQUESTS = "1", KIRO_DUMP_REQUESTS_DIR = "{workspace}/requests" }
args = ["--trust-workspace", "--output-format", "stream-json", "Reply with the word BOX-OK and nothing else."]
model = true
holds = ['"steeringDocuments":[*/.kiro/steering/*probe-steering.md"']
workspace_holds = { "requests/*/*.json" = "<user-rule id=*probe-steering>*feature-probe-instructions-one" }
note = "Kiro CLI names the host's steering file as one it reads, and the file's text is in the model request."

[[feature]]
id = "kiro-instructions-sync"
row = "Instructions"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key", "agent.skip-permissions=true"]
needs = ["kiro-cli"]
host = "kiro"
agent_env = { KIRO_DUMP_REQUESTS = "1", KIRO_DUMP_REQUESTS_DIR = "{workspace}/requests" }
args = ["--trust-workspace", "--output-format", "stream-json", "Reply with the word BOX-OK and nothing else."]
model = true
host_edit = { ".kiro/steering/probe-steering.md" = "feature-probe-instructions-two\n" }
workspace_holds = { "requests/*/*.json" = "<user-rule id=*probe-steering>*feature-probe-instructions-two" }
note = "The host's steering file changes between two runs, and the second run's model request holds the new text."

[[feature]]
id = "kiro-skills"
row = "Skills"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key", "agent.skip-permissions=true"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--trust-workspace", "--output-format", "stream-json", "Reply with the word BOX-OK and nothing else."]
model = true
holds = ['"availableCommands":[*"name":"probe-skill","description":"feature-probe-skill"']

[[feature]]
id = "kiro-commands"
row = "Commands (saved prompts)"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key", "agent.skip-permissions=true"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--trust-workspace", "--output-format", "stream-json", "Reply with the word BOX-OK and nothing else."]
model = true
holds = ['"availableCommands":[*"name":"probe-command"']

[[feature]]
id = "kiro-subagents"
row = "Subagents"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--version"]
storage_holds = { "home/.kiro/agents/probe-agent.json" = "feature-probe-agent" }
expect = { verdict = "red", reason = "storage has no file home/.kiro/agents/probe-agent.json" }
note = "The kiro pack does not copy ~/.kiro/agents: an agent's file can name hooks and MCP servers."

[[feature]]
id = "kiro-themes-keybindings"
row = "Themes, keybindings"
harness = "kiro"
note = "No check. The kiro pack copies no theme or keybinding file, and sets the theme from KIRO_TERMINAL_THEME."

[[feature]]
id = "kiro-agent-memory"
row = "Agent memory"
harness = "kiro"
note = "No check. The kiro pack copies no memory of Kiro CLI's."

[[feature]]
id = "kiro-preferences"
row = "Preferences file"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--version"]
storage_holds = { "home/.kiro/settings/cli.json" = ['"chat.enableContextUsageIndicator":*true', '"app.disableAutoupdates":*true'] }
storage_lacks = { "home/.kiro/settings/cli.json" = ["chat.defaultAgent", "chat.agentEngine"] }
note = "From the host's cli.json, only chat.defaultModel and chat.enableContextUsageIndicator come in, and the pack turns updates off."

[[feature]]
id = "kiro-model-choice"
row = "Model choice"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key", "agent.skip-permissions=true"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--trust-workspace", "--output-format", "stream-json", "Reply with the word BOX-OK and nothing else."]
model = true
holds = ['"category":"model","type":"select","currentValue":"claude-sonnet-4.5"']
note = "The host's cli.json names the model, and the session reports it. With no chat.defaultModel, Kiro CLI 3.4.0 reports auto, so a model that does not come in makes the check red."

[[feature]]
id = "kiro-environment-variables"
row = "Environment variables"
harness = "kiro"
note = "No check. The kiro pack passes only KIRO_TERMINAL_THEME and KIRO_RUNTIME_DIR from the shell into the box."

[[feature]]
id = "kiro-credential-helpers"
row = "Credential helpers, provider keys"
harness = "kiro"
note = "No check. Kiro CLI has no credential helper, and with kiro.sign-in = \"api-key\" the agent holds only a stand-in for the key."

[[feature]]
id = "kiro-login"
row = "Login"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--version"]
# cli.json shows that the copy ran, so the absent login is a choice and not an empty storage.
storage_holds = { "home/.kiro/settings/cli.json" = "" }
storage_lacks = { "home/.local/share/kiro-cli/data.sqlite3" = "", "home/Library/Application Support/kiro-cli/data.sqlite3" = "" }
note = "Kiro CLI keeps a login in data.sqlite3, on Linux and on macOS, and the box copies neither."

[[feature]]
id = "kiro-permission-rules"
row = "Permission rules"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--version"]
storage_holds = { "home/.kiro/agents/probe-agent.json" = "feature-probe-allow" }
expect = { verdict = "red", reason = "storage has no file home/.kiro/agents/probe-agent.json" }
note = "Kiro CLI keeps the tools an agent may run without asking in the agent's file, and the kiro pack does not copy ~/.kiro/agents."

[[feature]]
id = "kiro-hooks"
row = "Hooks"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--version"]
storage_holds = { "home/.kiro/agents/probe-agent.json" = "probe-hook" }
expect = { verdict = "red", reason = "storage has no file home/.kiro/agents/probe-agent.json" }
note = "Kiro CLI keeps hooks in an agent's file, and the kiro pack does not copy ~/.kiro/agents. A hook that came in would not run: Kiro CLI starts it through /bin/sh, which the box does not run."

[[feature]]
id = "kiro-mcp-servers"
row = "MCP servers"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key"]
needs = ["kiro-cli"]
host = "kiro"
args = ["--version"]
storage_holds = { "home/.kiro/settings/mcp.json" = "probe-mcp" }
expect = { verdict = "red", reason = "storage has no file home/.kiro/settings/mcp.json" }
note = "The kiro pack does not copy ~/.kiro/settings/mcp.json."

[[feature]]
id = "kiro-plugins"
row = "Plugins, extensions"
harness = "kiro"
note = "No check. The kiro pack brings in no Kiro power."

[[feature]]
id = "kiro-app-state"
row = "App state (onboarding, trust)"
harness = "kiro"
note = "No check. The kiro pack copies no app state, and a model check trusts its workspace with --trust-workspace."

[[feature]]
id = "kiro-sessions"
row = "Sessions and resume"
harness = "kiro"
note = "No check. A session is kept in the box only, and a test of resume needs two runs that call the model."

[[feature]]
id = "kiro-org-managed"
row = "Org-managed settings"
harness = "kiro"
note = "No check. A test needs a Kiro sign-in that an organization manages."

[[feature]]
id = "kiro-hello"
row = "Model call"
harness = "kiro"
with = "kiro"
options = ["kiro.sign-in=api-key", "agent.skip-permissions=true"]
needs = ["kiro-cli"]
args = ["--trust-workspace", "--output-format", "stream-json", "Reply with the word BOX-OK and nothing else."]
model = true
holds = ['"finalText":"BOX-OK']
note = "Kiro CLI reaches Kiro's service through the box with the key the box adds. finalText keeps the prompt's own text out of the pattern's reach."
