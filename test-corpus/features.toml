[[feature]]
id = "claude-permission-rules"
row = "Permission rules"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
storage_holds = { "config/settings.json" = ['"allow":*"Bash(feature-probe-allow:*)"', '"deny":*"Bash(feature-probe-deny:*)"'] }
storage_lacks = { "config/settings.json" = ["additionalDirectories", "disableBypassPermissionsMode"] }

[[feature]]
id = "claude-permission-mode"
row = "Permission rules"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"permissionMode":"acceptEdits"']

[[feature]]
id = "claude-hooks"
row = "Hooks"
harness = "claude"
with = "claude,bedrock"
options = ["claude.import-hooks=true"]
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
workspace_holds = { "hook-marker.txt" = "feature-probe-hook" }
note = "A SessionStart script hook from the host's settings.json writes hook-marker.txt in the workspace."

[[feature]]
id = "claude-mcp-servers"
row = "MCP servers"
harness = "claude"
with = "claude,bedrock"
options = ["claude.import-mcp=true"]
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"mcp_servers":[*"name":"probe-mcp"']
storage_holds = { "config/.claude.json" = '"mcpServers":*"probe-mcp"' }
note = "The server is /bin/cat, which answers nothing. The check shows that Claude Code lists the imported server, not that a server works."

[[feature]]
id = "claude-plugins"
row = "Plugins, extensions"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
holds = ['"subtype":"init"', '"plugins":[*"probe-plugin"']
expect = { verdict = "red", reason = 'the output does not hold *plugins*' }
note = "The claude pack copies no plugin folder."

[[feature]]
id = "claude-app-state"
row = "App state (onboarding, trust)"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["--version"]
storage_holds = { "config/.claude.json" = ['"hasCompletedOnboarding":*true', '"hasTrustDialogAccepted":*true'] }

[[feature]]
id = "claude-sessions"
row = "Sessions and resume"
harness = "claude"
note = "No check. A session is kept in the box only, and a test of resume needs two runs that call the model."

[[feature]]
id = "claude-org-managed"
row = "Org-managed settings"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
host = "claude"
args = ["-p", "x", "--output-format", "stream-json", "--verbose"]
until = '"subtype":"init"'
system = true
system_file = { macos = "/Library/Application Support/ClaudeCode/managed-settings.json", linux = "/etc/claude-code/managed-settings.json", content = '{"permissions":{"defaultMode":"plan"}}' }
holds = ['"permissionMode":"plan"']
expect = { verdict = "error", log = 'managed-settings.json" is refused' }
note = "The host's settings.json asks for acceptEdits, and the managed settings file wins. Today the box does not start on a Mac that has the file: the pack grants the folder and the file in it, and the box refuses the file's grant as one that lies inside the folder's."

[[feature]]
id = "claude-hello"
row = "Model call"
harness = "claude"
with = "claude,bedrock"
needs = ["claude"]
args = ["-p", "Reply with the word BOX-OK and nothing else.", "--output-format", "stream-json", "--verbose"]
model = true
holds = ['"result":"BOX-OK']
note = "The one check that calls Claude Code's model: the agent reaches it through the box."

