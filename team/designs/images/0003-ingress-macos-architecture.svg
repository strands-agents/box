<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8f4e"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27c0e"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="470" rx="18" fill="#ffffff"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#1d2228">macOS: what the relay uses to reach the agent</text>
<text x="40" y="80" font-size="15" fill="#6b7280">There is no network namespace: the agent listens on the Mac's own network, limited by Seatbelt to one port.</text>
<rect x="30" y="213" width="150" height="76" rx="12" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="105.0" y="249.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1d2228">Caller</text>
<text x="105.0" y="269.0" text-anchor="middle" font-size="12.5" fill="#6b7280">any TCP client</text>
<rect x="220" y="110" width="420" height="300" rx="16" fill="#fafbfc" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="240" y="138" font-size="15" font-weight="650" fill="#1d2228">Box's trusted process (TCB)</text>
<text x="240" y="157" font-size="12.5" fill="#6b7280">the Mac's network</text>
<rect x="250" y="180" width="360" height="70" rx="12" fill="#e3f5ea" stroke="#1f8f4e" stroke-width="2"/>
<text x="430.0" y="213.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0f5c31">Ingress listener</text>
<text x="430.0" y="233.0" text-anchor="middle" font-size="12.5" fill="#6b7280">listen, e.g. 127.0.0.1:18080</text>
<rect x="250" y="290" width="360" height="70" rx="12" fill="#e3f5ea" stroke="#1f8f4e" stroke-width="2"/>
<text x="430.0" y="323.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0f5c31">Ingress relay</text>
<text x="430.0" y="343.0" text-anchor="middle" font-size="12.5" fill="#6b7280">accept · connect · copy</text>
<rect x="700" y="110" width="550" height="300" rx="16" fill="none" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="720" y="138" font-size="15" font-weight="650" fill="#1d2228">Agent sandbox</text>
<text x="720" y="157" font-size="12.5" fill="#6b7280">a Seatbelt profile on the Mac's network</text>
<rect x="860" y="200" width="360" height="90" rx="12" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="1040.0" y="235.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1d2228">Agent's server</text>
<text x="1040.0" y="255.0" text-anchor="middle" font-size="12.5" fill="#6b7280">127.0.0.1:workload_port</text>
<text x="1040.0" y="272.0" text-anchor="middle" font-size="12.5" fill="#6b7280">e.g. app.run(port=18081)</text>
<rect x="860" y="312" width="360" height="66" rx="12" fill="#ffffff" stroke="#c7cdd6" stroke-dasharray="4 4"/>
<text x="1040" y="340" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d2228">Seatbelt rule: listen on workload_port only</text>
<text x="1040" y="360" text-anchor="middle" font-size="12.5" fill="#6b7280">on any address (network-bind, network-inbound)</text>
<path d="M180,251 L214,251 L214,215 L246,215" fill="none" stroke="#1f8f4e" stroke-width="3" marker-end="url(#an)"/>
<text x="197" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5c31">TCP</text>
<path d="M430,250 L430,286" fill="none" stroke="#1f8f4e" stroke-width="2.4" marker-end="url(#an)"/>
<path d="M610,325 L820,325 L820,245 L856,245" fill="none" stroke="#1f8f4e" stroke-width="3" marker-end="url(#an)"/>
<text x="712" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5c31">connects to</text>
<text x="712" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5c31">127.0.0.1:workload_port</text>
<text x="40" y="432" font-size="13" fill="#6b7280">No PID 1 and no Unix socket channel: the relay connects to the agent&#39;s port on the Mac&#39;s loopback itself.</text>
<text x="40" y="452" font-size="13" fill="#7a4a00">Other local processes can also connect to workload_port directly; "Who can reach the agent?" covers it.</text>
</svg>