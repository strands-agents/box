<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a9099"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8f4e"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27c0e"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="560" rx="18" fill="#ffffff"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#1d2228">Linux: how the relay reaches the agent</text>
<text x="40" y="80" font-size="15" fill="#6b7280">The agent's port exists only in its own network namespace. For each caller, PID 1 creates the socket there.</text>
<rect x="30" y="213" width="150" height="76" rx="12" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="105.0" y="249.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1d2228">Caller</text>
<text x="105.0" y="269.0" text-anchor="middle" font-size="12.5" fill="#6b7280">any TCP client</text>
<rect x="220" y="110" width="420" height="410" rx="16" fill="#fafbfc" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="240" y="138" font-size="15" font-weight="650" fill="#1d2228">Box's trusted process (TCB)</text>
<text x="240" y="157" font-size="12.5" fill="#6b7280">the container's network</text>
<rect x="250" y="175" width="360" height="64" rx="12" fill="#e3f5ea" stroke="#1f8f4e" stroke-width="2"/>
<text x="430.0" y="205.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0f5c31">Ingress listener</text>
<text x="430.0" y="225.0" text-anchor="middle" font-size="12.5" fill="#6b7280">listen, e.g. 0.0.0.0:8080</text>
<rect x="250" y="268" width="360" height="64" rx="12" fill="#e3f5ea" stroke="#1f8f4e" stroke-width="2"/>
<text x="430.0" y="298.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0f5c31">Ingress relay</text>
<text x="430.0" y="318.0" text-anchor="middle" font-size="12.5" fill="#6b7280">accept · connect · copy</text>
<rect x="250" y="410" width="360" height="84" rx="12" fill="#f4f5f7" stroke="#d6d9de" stroke-width="1.5"/>
<text x="430.0" y="450.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1d2228">Box-side Unix socket</text>
<text x="430.0" y="470.0" text-anchor="middle" font-size="12.5" fill="#6b7280">held by the relay</text>
<rect x="700" y="110" width="550" height="410" rx="16" fill="none" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="720" y="138" font-size="15" font-weight="650" fill="#1d2228">Agent sandbox</text>
<text x="720" y="157" font-size="12.5" fill="#6b7280">its own network namespace: loopback only</text>
<rect x="860" y="175" width="360" height="90" rx="12" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="1040.0" y="210.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1d2228">Agent's server</text>
<text x="1040.0" y="230.0" text-anchor="middle" font-size="12.5" fill="#6b7280">127.0.0.1:workload_port</text>
<text x="1040.0" y="247.0" text-anchor="middle" font-size="12.5" fill="#6b7280">e.g. app.run(port=8081)</text>
<rect x="900" y="395" width="320" height="114" rx="12" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/>
<text x="1060.0" y="434.0" text-anchor="middle" font-size="16" font-weight="650" fill="#1d2228">PID 1</text>
<text x="1060.0" y="454.0" text-anchor="middle" font-size="12.5" fill="#6b7280">holds the sandbox-side Unix socket</text>
<text x="1060.0" y="471.0" text-anchor="middle" font-size="12.5" fill="#6b7280"></text>
<text x="1060.0" y="488.0" text-anchor="middle" font-size="12.5" fill="#6b7280"></text>
<circle cx="932" cy="478" r="13" fill="#1f8f4e"/>
<text x="932" y="483" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
<text x="952" y="474" text-anchor="start" font-size="13" font-weight="700" fill="#0f5c31">creates an unconnected</text>
<text x="952" y="492" text-anchor="start" font-size="13" font-weight="700" fill="#0f5c31">TCP socket per caller</text>
<path d="M180,251 L214,251 L214,207 L246,207" fill="none" stroke="#1f8f4e" stroke-width="3" marker-end="url(#an)"/>
<text x="197" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5c31">TCP</text>
<path d="M430,239 L430,264" fill="none" stroke="#1f8f4e" stroke-width="2.4" marker-end="url(#an)"/>
<line x1="430" y1="332" x2="430" y2="406" stroke="#8a9099" stroke-width="2" stroke-dasharray="3 4"/>
<rect x="610" y="445" width="290" height="16" rx="8" fill="#eceef1" stroke="#c7cdd6"/>
<text x="755" y="457" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">Unix socket channel</text>
<path d="M620,428 L892,428" fill="none" stroke="#8a9099" stroke-width="2.2" marker-end="url(#ag)"/>
<circle cx="645" cy="428" r="13" fill="#8a9099"/>
<text x="645" y="433" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
<text x="665" y="420" text-anchor="start" font-size="13" font-weight="600" fill="#3d434b">ask PID 1 for a socket</text>
<path d="M892,482 L618,482" fill="none" stroke="#1f8f4e" stroke-width="2.6" marker-end="url(#an)"/>
<rect x="733" y="470" width="44" height="24" rx="6" fill="#e3f5ea" stroke="#1f8f4e" stroke-width="2"/>
<text x="755" y="487" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5c31">TCP</text>
<circle cx="645" cy="504" r="13" fill="#1f8f4e"/>
<text x="645" y="509" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
<text x="665" y="509" text-anchor="start" font-size="13" font-weight="700" fill="#0f5c31">send the socket back</text>
<path d="M610,300 L820,300 L820,220 L856,220" fill="none" stroke="#1f8f4e" stroke-width="3" marker-end="url(#an)"/>
<circle cx="660" cy="300" r="13" fill="#1f8f4e"/>
<text x="660" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
<text x="680" y="290" text-anchor="start" font-size="13" font-weight="700" fill="#0f5c31">connect it to</text>
<text x="680" y="324" text-anchor="start" font-size="13" font-weight="700" fill="#0f5c31">127.0.0.1:workload_port</text>
<text x="40" y="544" font-size="13" fill="#6b7280">The socket stays in the sandbox&#39;s network, where PID 1 created it, so the relay&#39;s connect (4) reaches the agent. Then the relay copies bytes both ways.</text>
</svg>