name: CodeQL

# Scan our own code, including the CI tooling. This replaces CodeQL default setup, which scans every
# language it finds, including the test-corpus fixtures: C#, Ruby, C/C++ and Swift that only exist
# as test inputs.
# The Swift scan alone took a macOS runner for 10 minutes on every push.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Default setup scanned weekly; keep that, so new queries reach main without a push.
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Each language here must have source outside the fixtures: CodeQL fails a language it
        # finds no code for. Box Core's C sources need `c-cpp` once they share this repository.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            # The fixtures are test inputs. The corpus tooling beside them runs in CI with
            # credentials, so it stays scanned.
            paths-ignore:
              - test-corpus/fixtures/**

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
