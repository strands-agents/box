name: Native Filesystem

on:
  workflow_call:

jobs:
  compile-and-test:
    name: macOS build and unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build experimental code and signed test package
        run: |
          cargo build --locked -p strands-box -p strands-box-containment --all-features
          cargo test --manifest-path test-native-filesystem/Cargo.toml --locked --no-run
          cargo test --manifest-path test-native-filesystem/Cargo.toml --locked --test bridge -- --nocapture
          cargo fmt --manifest-path test-native-filesystem/Cargo.toml --check
          cargo clippy --manifest-path test-native-filesystem/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Test native adapter and configuration
        run: |
          cargo test --locked -p strands-box --all-features --bin strands-box macos_enforcement
          cargo test --locked -p strands-box --all-features --bin strands-box native_
          cargo test --locked -p strands-box --all-features --bin strands-box record::config::
      - name: Test startup and record preservation
        run: |
          cargo test --locked -p strands-box --all-features --test macos_file_enforcement
          cargo test --locked -p strands-box --no-default-features --test macos_file_enforcement
      - name: Test signed receipt checker
        run: |
          python3 -m unittest discover -s test-native-filesystem -p '*_test.py'
      - name: Check signed receipt freshness (informational)
        id: signed-receipt
        continue-on-error: true
        run: python3 test-native-filesystem/receipt.py
      - name: Summarize native validation
        env:
          RECEIPT_OUTCOME: ${{ steps.signed-receipt.outcome }}
        run: |
          echo "Native adapter, configuration, and startup tests passed. The full signed native enforcement suite did not run." >> "$GITHUB_STEP_SUMMARY"
          echo "Signed receipt freshness: ${RECEIPT_OUTCOME} (informational only)." >> "$GITHUB_STEP_SUMMARY"
