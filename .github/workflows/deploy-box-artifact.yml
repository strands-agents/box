name: Release Box

# GitHub-native release path for Box Core and the box CLI. A manual dispatch names the
# version and a commit; the workflow builds strands-box for each target below on
# hosted runners, packages each binary set as a versioned tarball, and attaches
# the macOS and Linux tarballs with SHA256SUMS.txt to a GitHub Release. The
# reusable cli-release.yml builds, signs, and bundles the CLI's archives, and
# they go into the same release.
# Every release publishes macOS and Linux ARM64. The x86-64 archives are optional.
# That naming and layout is what download.sh (curl | sh), install.sh, and a
# Homebrew tap consume:
#
#   box-<version>-<triple>.tar.gz       Box Core, e.g. box-v0.1.0-aarch64-apple-darwin.tar.gz
#   box-cli-<version>-<triple>.tar.gz   the CLI, e.g. box-cli-v0.1.0-aarch64-apple-darwin.tar.gz
#   SHA256SUMS.txt                      one aggregate file, `<sha256>  <asset>` per line
#
# Three targets build: macOS on Apple Silicon, and Linux (glibc) on x86_64 and
# aarch64. Both Linux targets build against Amazon Linux 2023.
# musl and native distro packages are not built here.
#
# Shape (mirrors the harness-sdk release workflows, retargeted to a binary
# release): scan -> test-lint + cli-test / build / cli -> inspect -> approve ->
#           tag + release -> verify.
#
# Dry runs build and inspect without credentials by default. An upstream main
# dry run can opt into signing, notarization, and native tests. Protected premerge tests use a separate environment.
#
# Configure macos-signing and release-gate before a signed run.

on:
  workflow_dispatch:
    inputs:
      version:
        # Stable: 0.1.1. Pre-release: 0.1.1-preview.1. Linux preview:
        # 0.1.1-linux-preview.1. The workflow adds the v.
        description: 'Version, e.g. 0.1.1 (no v)'
        required: true
        type: string
      publish_linux_x86:
        description: 'Also publish the Linux x86-64 archive'
        required: true
        default: true
        type: boolean
      sha:
        # Releases require main history. Dry runs also accept the dispatched
        # commit and default to it.
        description: 'Source SHA (optional)'
        required: false
        default: ''
        type: string
      dry_run:
        # Build and inspect, so you can review the bundle on the run page, but
        # skip approve, tag, release, and verify.
        description: 'Dry run'
        required: true
        default: true
        type: boolean
      sign_macos:
        # Also sign, notarize, and test macOS in a dry run. Requires the
        # protected signing environment. Real releases always sign.
        description: 'Sign macOS in a dry run'
        required: true
        default: false
        type: boolean
      premerge_signing_test:
        # Protected PR signing test only. Requires dry_run, sign_macos, and
        # macos-signing-test approval.
        description: 'Pre-merge signing test'
        required: true
        default: false
        type: boolean
      native_filesystem_policy:
        # Compile native policy into the CLI's ARM64 packages. Dry run only.
        description: 'Experimental native filesystem policy (dry run only; ARM64)'
        required: false
        default: false
        type: boolean
      skip_tests:
        # Fork testing only: skip the test and lint job so the release pipeline
        # runs without waiting on it. Inert on the upstream repo.
        description: 'Skip tests (forks only)'
        required: true
        default: false
        type: boolean

concurrency:
  group: release-box
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Resolve the commit, validate the version, refuse a bad bump ─────────
  scan:
    name: Resolve SHA and validate version
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.scan.outputs.release_sha }}
      prev_tag: ${{ steps.scan.outputs.prev_tag }}
      new_tag: ${{ steps.scan.outputs.new_tag }}
      linux_preview: ${{ steps.scan.outputs.linux_preview }}
      prerelease: ${{ steps.scan.outputs.prerelease }}
      publish_linux_x86: ${{ steps.scan.outputs.publish_linux_x86 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve SHA, find previous tag, validate version
        id: scan
        env:
          NEW_VERSION: ${{ inputs.version }}
          PUBLISH_LINUX_X86: ${{ inputs.publish_linux_x86 }}
          SHA_INPUT: ${{ inputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_SHA: ${{ github.sha }}
          NATIVE_FILESYSTEM_POLICY: ${{ inputs.native_filesystem_policy }}
        run: |
          set -euo pipefail

          case "${NATIVE_FILESYSTEM_POLICY:-false}" in
            true|false) ;;
            *) echo "::error::native_filesystem_policy must be true or false"; exit 1 ;;
          esac
          if [ "${NATIVE_FILESYSTEM_POLICY:-false}" = true ] && [ "$DRY_RUN" != true ]; then
            echo "::error::native_filesystem_policy requires dry_run=true"
            exit 1
          fi

          # 1. Derive the release channel from a strict version format. A pre-release
          #    (-preview.N) and a Linux preview (-linux-preview.N) publish as GitHub
          #    prereleases, which never become the latest release.
          if ! [[ "$NEW_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(linux-)?preview\.[1-9][0-9]*)?$ ]]; then
            echo "::error::expected MAJOR.MINOR.PATCH, optionally followed by -preview.N or -linux-preview.N with N greater than zero."
            exit 1
          fi
          BASE_VERSION="${NEW_VERSION%%-*}"
          LINUX_PREVIEW=false
          PRERELEASE=false
          if [ "$BASE_VERSION" != "$NEW_VERSION" ]; then
            PRERELEASE=true
          fi
          if [ "${NEW_VERSION#*-linux-preview.}" != "$NEW_VERSION" ]; then
            LINUX_PREVIEW=true
          fi

          if [ "$PUBLISH_LINUX_X86" != "true" ] && [ "$PUBLISH_LINUX_X86" != "false" ]; then
            echo "::error::publish_linux_x86 must be true or false."
            exit 1
          fi

          # 2. Dry runs can validate the dispatched commit before merge.
          if [ -n "$SHA_INPUT" ]; then
            RELEASE_SHA=$(git rev-parse --verify "$SHA_INPUT^{commit}" 2>/dev/null) || {
              echo "::error::sha '$SHA_INPUT' is not a valid commit."
              exit 1
            }
          elif [ "$DRY_RUN" = "true" ]; then
            RELEASE_SHA=$(git rev-parse --verify "$DISPATCH_SHA^{commit}")
          else
            RELEASE_SHA=$(git rev-parse origin/main)
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            if [ "$DRY_RUN" != "true" ] || [ "$RELEASE_SHA" != "$DISPATCH_SHA" ]; then
              echo "::error::source must belong to main history, or match the dispatched commit for a dry run."
              exit 1
            fi
          fi

          # 3. Resolve the previous tag. A baseline is required.
          TAG_PREFIX="v"
          PREV_TAG=$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname |
            awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found {print; found=1}')
          if [ -z "$PREV_TAG" ]; then
            echo "::error::No prior tag matching ${TAG_PREFIX}* -- refusing to release without a baseline. (Fork-testing? Push a baseline tag first, e.g. \`git tag ${TAG_PREFIX}0.0.1 <sha> && git push origin ${TAG_PREFIX}0.0.1\`.)"
            exit 1
          fi
          PREV_VERSION="${PREV_TAG#"${TAG_PREFIX}"}"
          NEW_TAG="${TAG_PREFIX}${NEW_VERSION}"

          # 4. Reject duplicate / non-monotonic / pre-existing tags, and require a
          #    single-step increment (major, minor, or patch) so a typo like
          #    0.1.0 -> 0.10.0 fails here instead of relying on the approver.
          if [ "$BASE_VERSION" = "$PREV_VERSION" ]; then
            echo "::error::version $NEW_VERSION matches existing tag $PREV_TAG."
            exit 1
          fi
          HIGHER=$(printf '%s\n%s\n' "$PREV_VERSION" "$BASE_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" != "$BASE_VERSION" ]; then
            echo "::error::version $NEW_VERSION is not greater than previous $PREV_VERSION."
            exit 1
          fi
          # Validate the baseline first: a malformed previous tag must fail with
          # a clear message, not a cryptic arithmetic error under set -e.
          if ! [[ "$PREV_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::previous tag version '$PREV_VERSION' is not bare semver -- cannot compute the increment baseline."
            exit 1
          fi
          IFS=. read -r P_MAJ P_MIN P_PAT <<< "$PREV_VERSION"
          VALID="$((P_MAJ+1)).0.0 ${P_MAJ}.$((P_MIN+1)).0 ${P_MAJ}.${P_MIN}.$((P_PAT+1))"
          case " $VALID " in
            *" $BASE_VERSION "*) ;;
            *)
              echo "::error::version $NEW_VERSION is not a single increment of $PREV_VERSION (expected one of: $VALID)."
              exit 1;;
          esac
          if git rev-parse --verify "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
            echo "::error::tag $NEW_TAG already exists."
            exit 1
          fi
          # A preview's number rises within its channel, so preview.2 never follows preview.3.
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL="${NEW_TAG%.*}."
            LAST_TAG=$(git tag --list "${CHANNEL}*" --sort=-v:refname |
              awk -v channel="$CHANNEL" 'index($0, channel) == 1 && substr($0, length(channel) + 1) ~ /^[1-9][0-9]*$/ {print; exit}')
            if [ -n "$LAST_TAG" ] && [ "${NEW_TAG##*.}" -le "${LAST_TAG##*.}" ]; then
              echo "::error::version $NEW_VERSION is not above the earlier preview $LAST_TAG."
              exit 1
            fi
          fi

          # 5. Sanity-check: at least one commit since prev tag.
          COUNT=$(git rev-list --count "$PREV_TAG..$RELEASE_SHA")
          if [ "$COUNT" = "0" ]; then
            echo "::error::no commits between $PREV_TAG and $RELEASE_SHA -- nothing to release."
            exit 1
          fi

          {
            echo "release_sha=$RELEASE_SHA"
            echo "prev_tag=$PREV_TAG"
            echo "new_tag=$NEW_TAG"
            echo "linux_preview=$LINUX_PREVIEW"
            echo "prerelease=$PRERELEASE"
            echo "publish_linux_x86=$PUBLISH_LINUX_X86"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release scan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Previous tag | \`$PREV_TAG\` |"
            echo "| Proposed tag | \`$NEW_TAG\` |"
            echo "| Prerelease | $PRERELEASE |"
            echo "| Linux preview | $LINUX_PREVIEW |"
            echo "| Publish Linux x86-64 | $PUBLISH_LINUX_X86 |"
            echo "| Pinned SHA | \`$RELEASE_SHA\` |"
            echo "| Commits since prev tag | **$COUNT** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate signing mode and source
        env:
          PREMERGE_TEST: ${{ inputs.premerge_signing_test }}
          DRY_RUN: ${{ inputs.dry_run }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.scan.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$PREMERGE_TEST" = true ]; then
            test "$DRY_RUN" = true
            test "$SIGN_MACOS" = true
            test "$REPOSITORY" = strands-agents/box
            test "$WORKFLOW_REF" = refs/heads/feature/macos-release-notarization
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          elif [ "$DRY_RUN" != true ] || [ "$SIGN_MACOS" = true ]; then
            test "$REPOSITORY" = strands-agents/box
            test "$WORKFLOW_REF" = refs/heads/main
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          fi

  # ── Build + lint + unit-test gate ──────────────────────────────────────
  test:
    name: Test and lint
    needs: scan
    # A fork run may skip this job with `skip_tests` so the release pipeline
    # runs without waiting on the full matrix. The skip is inert on the
    # upstream repo, so a real release still gates on test + lint.
    if: ${{ !(inputs.skip_tests == true && github.event.repository.fork == true) }}
    uses: ./.github/workflows/rust-test-lint.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.scan.outputs.release_sha }}

  # ── The CLI's tests, the second release gate ───────────────────────────
  # The same skip rule as the test job: only a fork run may skip it.
  cli-test:
    name: CLI test
    needs: scan
    if: ${{ !(inputs.skip_tests == true && github.event.repository.fork == true) }}
    uses: ./.github/workflows/cli-test.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.scan.outputs.release_sha }}
      suite: all
      macos: true
      package: true

  # ── Build, sign, and check the CLI, in the reusable CLI release workflow ─
  # Real releases always sign. A dry run signs only with sign_macos=true, and a pre-merge
  # signing test signs only Box Core. Signing waits for the tests, so the build waits for them
  # too. A fork run may skip the tests (see the test job).
  cli:
    name: CLI
    needs: [scan, test, cli-test]
    if: |
      always() &&
      needs.scan.result == 'success' &&
      ((needs.test.result == 'success' && needs.cli-test.result == 'success') ||
        (needs.test.result == 'skipped' && needs.cli-test.result == 'skipped' &&
          inputs.skip_tests == true && github.event.repository.fork == true))
    uses: ./.github/workflows/cli-release.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ inputs.version }}
      tag: ${{ needs.scan.outputs.new_tag }}
      sha: ${{ needs.scan.outputs.release_sha }}
      publish_linux_x86: ${{ needs.scan.outputs.publish_linux_x86 == 'true' }}
      native_filesystem_policy: ${{ inputs.native_filesystem_policy }}
      sign: >-
        ${{ github.repository == 'strands-agents/box' && github.ref == 'refs/heads/main' &&
        inputs.premerge_signing_test != true &&
        (inputs.dry_run != true || inputs.sign_macos == true) }}

  build:
    name: Build ${{ matrix.target.label }}
    needs: scan
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            label: Linux x86_64
            runner: ubuntu-24.04
          - triple: aarch64-unknown-linux-gnu
            label: Linux ARM64
            runner: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            label: macOS ARM64
            runner: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.scan.outputs.release_sha }}
          persist-credentials: false

      - name: Prepare the Amazon Linux 2023 builder
        if: endsWith(matrix.target.triple, '-unknown-linux-gnu')
        run: |
          set -euo pipefail
          rust_version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$rust_version"
          docker build --file scripts/linux-release.Dockerfile \
            --build-arg "RUST_VERSION=$rust_version" \
            --tag box-linux-release .

      - name: Add rust target
        run: rustup target add ${{ matrix.target.triple }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-edit

      - name: Stamp the release version into the crates
        # Stamp the release version onto the shipped crates; this also rewrites
        # Cargo.lock, so the --locked build still passes.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo set-version -p strands-box -p strands-box-containment "$VERSION"

      - name: Require the native macOS SDK
        if: matrix.target.triple == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk%%.*}" -ge 27

      - name: Build strands-box (release)
        # box, sock-alias, and contain-trampoline must ship together; the box
        # resolves the trampoline from beside its own executable and refuses
        # to start without it.
        if: matrix.target.triple == 'aarch64-apple-darwin'
        env:
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          features=()
          if [ "$TRIPLE" = aarch64-apple-darwin ]; then
            features=(--features native-filesystem-policy)
          fi
          cargo build --release --locked \
            --target "$TRIPLE" \
            -p strands-box \
            -p strands-box-containment "${features[@]}"

      - name: Build Linux against glibc 2.34
        if: endsWith(matrix.target.triple, '-unknown-linux-gnu')
        env:
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          mkdir -p target
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$PWD/target,target=/target" \
            --env CARGO_TARGET_DIR=/target \
            box-linux-release \
            cargo build --release --locked --target "$TRIPLE" \
              -p strands-box -p strands-box-containment

      - name: Package tarball
        # Stage the exact ./box-core layout, then tar its contents. Add a file
        # here to ship it; the downloader extracts whatever is in the tarball.
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          asset="box-${NEW_TAG}-${TRIPLE}.tar.gz"
          stage="stage/box-core"
          mkdir -p "$stage" dist
          cp "target/${TRIPLE}/release/strands-box" "$stage/box"
          cp "target/${TRIPLE}/release/strands-box-sock-alias" "$stage/strands-box-sock-alias"
          cp "target/${TRIPLE}/release/strands-box-contain-trampoline" "$stage/strands-box-contain-trampoline"
          chmod 0755 "$stage"/*
          tar -C "$stage" -czf "dist/${asset}" .
          tar -tzf "dist/${asset}"

      - name: Assert the packaged binary reports the stamped version
        # Each leg stamps its own crates, so each leg checks its packaged binary.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out=$(stage/box-core/box --version)
          echo "box --version: $out"
          if ! grep -Eq "(^| )${VERSION}( |$)" <<<"$out"; then
            echo "::error::box --version ('$out') does not report $VERSION"
            exit 1
          fi

      - name: Check the x86-64 Linux package
        if: matrix.target.triple == 'x86_64-unknown-linux-gnu'
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
        run: |
          set -euo pipefail
          # Reject a selected source that still requires either retired opt-in.
          if output=$(env -u EXPERIMENTAL_LINUX_SUPPORT -u EXPERIMENTAL_X86_SUPPORT \
            stage/box-core/box run --config "$RUNNER_TEMP/missing-x86-config.toml" 2>&1); then
            echo "::error::Linux x86-64 startup accepted a missing configuration."
            exit 1
          fi
          if ! grep -Fq "$RUNNER_TEMP/missing-x86-config.toml" <<< "$output"; then
            echo "::error::Linux x86-64 startup did not reach configuration validation without an opt-in."
            printf '%s\n' "$output"
            exit 1
          fi
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            box-linux-release \
            python3 scripts/check-linux-package.py stage/box-core \
              --target x86_64-unknown-linux-gnu
          # This named profile permits user namespaces for the disposable test container.
          cat > "$RUNNER_TEMP/box-package-smoke.apparmor" <<'EOF'
          abi <abi/4.0>,
          profile box-package-smoke flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/box-package-smoke.apparmor"
          # Namespace setup needs a fresh proc mount, without Docker's masked system paths.
          docker run --rm --cap-drop ALL --user 1000:1000 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=box-package-smoke \
            --security-opt systempaths=unconfined \
            --env HOME=/home/box-test \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            box-linux-release \
            python3 scripts/smoke-linux-package.py \
              "dist/box-${NEW_TAG}-x86_64-unknown-linux-gnu.tar.gz"

      - name: Check and run the ARM64 Linux package
        if: matrix.target.triple == 'aarch64-unknown-linux-gnu'
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
        run: |
          set -euo pipefail
          # Reject a selected source that still refuses startup without an opt-in.
          if output=$(env -u EXPERIMENTAL_LINUX_SUPPORT stage/box-core/box run \
            --config "$RUNNER_TEMP/missing-linux-config.toml" 2>&1); then
            echo "::error::Linux startup accepted a missing configuration."
            exit 1
          fi
          if ! grep -Fq "$RUNNER_TEMP/missing-linux-config.toml" <<< "$output"; then
            echo "::error::Linux startup did not reach configuration validation without an opt-in."
            printf '%s\n' "$output"
            exit 1
          fi
          # This named profile permits user namespaces for the disposable test container.
          cat > "$RUNNER_TEMP/box-package-smoke.apparmor" <<'EOF'
          abi <abi/4.0>,
          profile box-package-smoke flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/box-package-smoke.apparmor"
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            box-linux-release \
            python3 scripts/check-linux-package.py stage/box-core
          # Namespace setup needs a fresh proc mount, without Docker's masked system paths.
          docker run --rm --cap-drop ALL --user 1000:1000 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=box-package-smoke \
            --security-opt systempaths=unconfined \
            --env HOME=/home/box-test \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            box-linux-release \
            python3 scripts/smoke-linux-package.py \
              "dist/box-${NEW_TAG}-aarch64-unknown-linux-gnu.tar.gz"

      - name: Record the macOS build features
        if: matrix.target.triple == 'aarch64-apple-darwin'
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          SOURCE_SHA: ${{ needs.scan.outputs.release_sha }}
        run: |
          set -euo pipefail
          cargo read-manifest --manifest-path crates/box/Cargo.toml > "$RUNNER_TEMP/box-manifest.json"
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "box-manifest.json").read_text())
          features = sorted(set(manifest.get("features", {}).get("default", []) + ["native-filesystem-policy"]))
          asset = Path("dist") / f"box-{os.environ['NEW_TAG']}-aarch64-apple-darwin.tar.gz"
          metadata = {
              "source_sha": os.environ["SOURCE_SHA"],
              "features": features,
              "input_sha256": hashlib.sha256(asset.read_bytes()).hexdigest(),
          }
          path = asset.with_name(asset.name.removesuffix(".tar.gz") + ".build-metadata.json")
          path.write_text(json.dumps(metadata, indent=2) + "\n")
          PYTHON

      - name: Upload the macOS build metadata
        if: matrix.target.triple == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-metadata
          path: dist/*.build-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: box-${{ needs.scan.outputs.new_tag }}-${{ matrix.target.triple }}
          path: dist/box-${{ needs.scan.outputs.new_tag }}-${{ matrix.target.triple }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    name: Sign and notarize the macOS application
    cache-mode: none
    needs: [scan, test, build]
    if: >-
      github.repository == 'strands-agents/box' &&
      (github.ref == 'refs/heads/main' ||
       (inputs.premerge_signing_test == true && inputs.dry_run == true &&
        github.ref == 'refs/heads/feature/macos-release-notarization')) &&
      (inputs.dry_run != true || inputs.sign_macos == true)
    runs-on: xcode-27
    timeout-minutes: 90
    environment: ${{ inputs.premerge_signing_test == true && 'macos-signing-test' || 'macos-signing' }}
    outputs:
      team_id: ${{ vars.CD_SIGNER_TEAM_ID }}
      profile_name: ${{ vars.CD_SIGNER_PROFILE_NAME }}
    permissions:
      contents: read
      id-token: write
    env:
      CD_SIGNER_ENDPOINT: ${{ vars.CD_SIGNER_ENDPOINT }}
      CD_SIGNER_BUCKET: ${{ vars.CD_SIGNER_BUCKET }}
      CD_SIGNER_BUCKET_ACCESS_ROLE: ${{ vars.CD_SIGNER_BUCKET_ACCESS_ROLE }}
      CD_SIGNER_TEAM_ID: ${{ vars.CD_SIGNER_TEAM_ID }}
      CD_SIGNER_PROFILE_NAME: ${{ vars.CD_SIGNER_PROFILE_NAME }}
      NOTARY_CREDENTIAL_SECRET: ${{ vars.NOTARY_CREDENTIAL_SECRET }}
    steps:
      - name: Check approved test commits
        if: inputs.premerge_signing_test == true
        env:
          APPROVED_WORKFLOW_SHA: ${{ vars.SIGNING_TEST_WORKFLOW_SHA }}
          APPROVED_SOURCE_SHA: ${{ vars.SIGNING_TEST_SOURCE_SHA }}
          WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.scan.outputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$APPROVED_WORKFLOW_SHA"
          test "$SOURCE_SHA" = "$APPROVED_SOURCE_SHA"
      - name: Checkout trusted workflow tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's macOS build
        uses: actions/download-artifact@v8
        with:
          name: box-${{ needs.scan.outputs.new_tag }}-aarch64-apple-darwin
          path: unsigned
      - name: Download this run's macOS build metadata
        uses: actions/download-artifact@v8
        with:
          name: macos-build-metadata
          path: unsigned
      - name: Install signing tools
        run: |
          brew install gnu-tar
          python3 -m venv "$RUNNER_TEMP/signing-venv"
          "$RUNNER_TEMP/signing-venv/bin/pip" install boto3==1.42.61 requests==2.32.5
      - name: Obtain temporary signing credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.CD_SIGNER_CALLER_ROLE }}
          aws-region: ${{ vars.CD_SIGNER_REGION }}
          role-session-name: box-release-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Sign, notarize, and staple the application
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.scan.outputs.release_sha }}
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
        run: |
          "$RUNNER_TEMP/signing-venv/bin/python" scripts/macos-release.py sign \
            --input "unsigned/box-${NEW_TAG}-aarch64-apple-darwin.tar.gz" \
            --build-metadata "unsigned/box-${NEW_TAG}-aarch64-apple-darwin.build-metadata.json" \
            --output "signed/box-${NEW_TAG}-aarch64-apple-darwin.tar.gz" \
            --work "$RUNNER_TEMP/signing" --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --notary-secret "$NOTARY_CREDENTIAL_SECRET"
      - name: Retain signing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-signing-evidence
          path: ${{ runner.temp }}/signing/**/*.json
          if-no-files-found: warn
      - name: Upload the verified signed package
        uses: actions/upload-artifact@v7
        with:
          name: macos-signed-package
          path: signed/*.tar.gz
          if-no-files-found: error

  verify-macos:
    name: Test the signed macOS package
    cache-mode: none
    needs: [scan, sign-macos]
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CD_SIGNER_TEAM_ID: ${{ needs.sign-macos.outputs.team_id }}
      CD_SIGNER_PROFILE_NAME: ${{ needs.sign-macos.outputs.profile_name }}
    steps:
      - name: Checkout trusted verification source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the signed package
        uses: actions/download-artifact@v8
        with:
          name: macos-signed-package
          path: signed
      - name: Verify installation and signed native enforcement
        env:
          VERSION: ${{ inputs.version }}
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          SOURCE_SHA: ${{ needs.scan.outputs.release_sha }}
          VERIFICATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk%%.*}" -ge 27
          package="$RUNNER_TEMP/installed-box"
          mkdir "$package"
          tar -C "$package" -xzf "signed/box-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
          python3 scripts/macos-release.py verify \
            --app "$package/Box.app" --evidence "$RUNNER_TEMP/package-verification"
          printf '{"source_sha":"%s","verification_sha":"%s"}\n' \
            "$SOURCE_SHA" "$VERIFICATION_SHA" > "$RUNNER_TEMP/package-verification/source.json"
          "$package/box" --version | grep -F "$VERSION"
          export STRANDS_BOX_SIGNED_TEST_BINARY="$package/box"
          cargo test --manifest-path test-native-filesystem/Cargo.toml --locked \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
      - name: Retain package verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-verification
          path: |
            ${{ runner.temp }}/package-verification/*.json
            ${{ runner.temp }}/native-tests.log
          if-no-files-found: warn

  # ── Inspect the built tarballs, then re-upload the verified bundle ──────
  # The release job publishes only from this bundle, so the bytes on the run
  # page are the bytes attached to the release.
  inspect:
    name: Inspect release tarballs
    needs: [scan, build, sign-macos, verify-macos, cli]
    # A dry run without sign_macos inspects the unsigned builds. Anything else needs Box Core's
    # signed, checked package, and the CLI's too, except in a pre-merge signing test.
    if: >-
      always() && needs.scan.result == 'success' && needs.build.result == 'success' &&
      needs.cli.result == 'success' &&
      ((inputs.dry_run == true && inputs.sign_macos != true) ||
       (needs.sign-macos.result == 'success' && needs.verify-macos.result == 'success' &&
        (needs.cli.outputs.signed == 'true' || inputs.premerge_signing_test == true)))
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: box-*

      - name: Download qualified macOS package
        if: needs.verify-macos.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: macos-signed-package
          path: assets/box-${{ needs.scan.outputs.new_tag }}-aarch64-apple-darwin

      # Its artifacts start with cli-, so the box-* download above leaves them out.
      - name: Download the CLI release bundle
        uses: actions/download-artifact@v8
        with:
          name: cli-release-bundle
          path: cli-release

      - name: Collect tarballs and compute SHA256SUMS.txt
        # Every target lands in built/. Only qualified architectures enter release/.
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          LINUX_PREVIEW: ${{ needs.scan.outputs.linux_preview }}
          PUBLISH_LINUX_X86: ${{ needs.scan.outputs.publish_linux_x86 }}
        run: |
          set -euo pipefail
          mkdir -p built release
          find assets -type f -name '*.tar.gz' -exec cp {} built/ \;
          darwin="built/box-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
          if [ ! -f "$darwin" ]; then
            echo "::error::missing the macOS tarball $darwin"
            exit 1
          fi
          linux="built/box-${NEW_TAG}-aarch64-unknown-linux-gnu.tar.gz"
          if [ ! -f "$linux" ]; then
            echo "::error::missing the ARM64 Linux tarball $linux"
            exit 1
          fi
          linux_x86="built/box-${NEW_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          if [ ! -f "$linux_x86" ]; then
            echo "::error::missing the x86-64 Linux tarball $linux_x86"
            exit 1
          fi
          cp "$darwin" release/
          cp "$linux" "release/box-${NEW_TAG}-linux-arm64.tar.gz"
          if [ "$PUBLISH_LINUX_X86" = "true" ]; then
            cp "$linux_x86" "release/box-${NEW_TAG}-linux-x86_64.tar.gz"
          fi
          # The CLI's bundle holds only the archives it qualified for this release.
          cp cli-release/box-cli-"${NEW_TAG}"-*.tar.gz release/
          (cd release && sha256sum -- *.tar.gz | sort -k 2 > SHA256SUMS.txt)
          echo "Built tarballs:"
          ls -la built
          echo
          echo "Release contents:"
          ls -la release
          echo
          cat release/SHA256SUMS.txt

      - name: Assert the expected tarballs, each carrying box
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          LINUX_PREVIEW: ${{ needs.scan.outputs.linux_preview }}
          PUBLISH_LINUX_X86: ${{ needs.scan.outputs.publish_linux_x86 }}
        run: |
          set -euo pipefail
          expected=(
            "box-${NEW_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "box-${NEW_TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "box-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [ ! -f "built/$asset" ]; then
              echo "::error::missing expected asset built/$asset"
              exit 1
            fi
            # Files in the tarball, with the leading ./ and the dir entry stripped.
            names=$(tar -tzf "built/$asset" | sed 's#^\./##' | grep -v '^$' | sort | tr '\n' ' ')
            echo "$asset: $names"
            case " $names " in
              *" box "*) ;;
              *) echo "::error::$asset does not contain box (got: $names)"; exit 1;;
            esac
          done
          count=$(find built -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')
          if [ "$count" != "${#expected[@]}" ]; then
            echo "::error::expected ${#expected[@]} built tarballs, found $count"
            exit 1
          fi
          released=$(cd release && printf '%s\n' *.tar.gz | sort)
          release_assets=(
            "box-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
            "box-${NEW_TAG}-linux-arm64.tar.gz"
            "box-cli-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
            "box-cli-${NEW_TAG}-aarch64-unknown-linux-gnu.tar.gz"
          )
          if [ "$PUBLISH_LINUX_X86" = "true" ]; then
            release_assets+=(
              "box-${NEW_TAG}-linux-x86_64.tar.gz"
              "box-cli-${NEW_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            )
          fi
          expected_release=$(printf '%s\n' "${release_assets[@]}" | sort)
          if [ "$released" != "$expected_release" ]; then
            echo "::error::release bundle has an unexpected asset set: $released"
            exit 1
          fi
          listed=$(awk '{print $2}' release/SHA256SUMS.txt | sort)
          if [ "$listed" != "$expected_release" ]; then
            echo "::error::SHA256SUMS.txt lists an unexpected asset set: $listed"
            exit 1
          fi

      - name: Assert the macOS package carries its notarization ticket
        if: needs.verify-macos.result == 'success'
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
        run: |
          set -euo pipefail
          darwin="release/box-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
          listing=$(tar -tzf "$darwin")
          if ! grep -qx './Box.app/Contents/CodeResources' <<<"$listing"; then
            echo "::error::$darwin does not contain a stapled notarization ticket"
            exit 1
          fi

      - name: Upload verified release bundle for publish
        uses: actions/upload-artifact@v7
        with:
          name: box-release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # ── Reviewer approval (skipped on Dry-Run) ─────────────────────────────
  # The release gate: runs only for a real release, and only after scan +
  # build + inspect pass. The test gate is required, except a fork run may
  # skip it with `skip_tests` (see the test job); a skipped test job satisfies
  # the gate only on a fork, so the upstream repo always runs it.
  approve-release:
    name: Wait for reviewer approvals
    needs: [scan, test, cli-test, build, cli, inspect]
    if: |
      always() &&
      inputs.dry_run != true &&
      inputs.premerge_signing_test != true &&
      needs.scan.result == 'success' &&
      ((needs.test.result == 'success' && needs.cli-test.result == 'success') ||
        (needs.test.result == 'skipped' && needs.cli-test.result == 'skipped' &&
          inputs.skip_tests == true && github.event.repository.fork == true)) &&
      needs.build.result == 'success' &&
      needs.cli.result == 'success' &&
      needs.inspect.result == 'success'
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment:
      # Configure reviewers + main-only deployment branches in repo settings.
      # A fork has no reviewer config here, so this just passes on a fork; the
      # release still goes to the fork's own repo.
      name: release-gate
    permissions: {}
    steps:
      - name: Acknowledge approval
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          RELEASE_SHA: ${{ needs.scan.outputs.release_sha }}
        run: |
          echo "Approved to release $NEW_TAG at $RELEASE_SHA."

  # ── Tag + publish the GitHub Release ───────────────────────────────────
  # The tag is the source of truth: it is pushed before the release is
  # published, and both steps are idempotent, so re-running after a partial
  # failure is safe.
  release:
    name: Publish GitHub Release
    needs: [scan, approve-release, inspect]
    # always() is required: a skipped `test` (via skip_tests) poisons every
    # downstream job that does not use it, so gate on the explicit results
    # instead. approve-release already encodes the test-skip rule.
    if: |
      always() &&
      inputs.dry_run != true &&
      inputs.premerge_signing_test != true &&
      needs.scan.result == 'success' &&
      needs.inspect.result == 'success' &&
      needs.approve-release.result == 'success'
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.scan.outputs.release_sha }}
          persist-credentials: true

      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: box-release-bundle
          path: release

      - name: Compose release body (install block)
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          RELEASE_SHA: ${{ needs.scan.outputs.release_sha }}
          LINUX_PREVIEW: ${{ needs.scan.outputs.linux_preview }}
          PRERELEASE: ${{ needs.scan.outputs.prerelease }}
          PUBLISH_LINUX_X86: ${{ needs.scan.outputs.publish_linux_x86 }}
        run: |
          set -euo pipefail
          platforms="macOS 15 or later on Apple silicon and ARM64 Linux"
          if [ "$PUBLISH_LINUX_X86" = "true" ]; then
            platforms="macOS 15 or later on Apple silicon, ARM64 Linux, and x86-64 Linux"
          fi
          installer="curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh |"
          cat > body.md <<EOF
          ## Install box

          \`box\` runs coding agents such as Claude Code and Codex in a Strands Box, using profiles for your model provider and tools. This release supports ${platforms}.

          EOF
          # The installer and the downloader both resolve the latest release, which is
          # never a prerelease, so a prerelease page offers only the pinned commands.
          if [ "$PRERELEASE" != "true" ]; then
            cat >> body.md <<EOF
          Install the latest release:

          \`\`\`sh
          ${installer}
            BOX_GITHUB_REPO=${GITHUB_REPOSITORY} sh
          \`\`\`

          EOF
          fi
          cat >> body.md <<EOF
          Install this exact release:

          \`\`\`sh
          ${installer}
            BOX_GITHUB_REPO=${GITHUB_REPOSITORY} BOX_VERSION=${NEW_TAG#v} sh
          \`\`\`

          The installer verifies the \`box-cli-\` archive for your platform against \`SHA256SUMS.txt\`, and on macOS its Apple signature, then puts \`box\` on your \`PATH\`.

          ## Download Box Core

          Download Box Core into a local directory:

          EOF
          if [ "$PRERELEASE" = "true" ]; then
            cat >> body.md <<EOF
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/strands-agents/box/main/download.sh | BOX_VERSION=${NEW_TAG} sh
          \`\`\`

          EOF
          else
            cat >> body.md <<EOF
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/strands-agents/box/main/download.sh | sh
          \`\`\`

          Pin this exact release:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/strands-agents/box/main/download.sh | BOX_VERSION=${NEW_TAG} sh
          \`\`\`

          EOF
          fi
          cat >> body.md <<EOF
          The downloader picks the archive for your platform from the assets below, verifies it against \`SHA256SUMS.txt\`, and unpacks its files into \`./box-core\`. Nothing is installed: your \`\$PATH\` and system directories are untouched. Override the directory with \`BOX_DOWNLOAD_DIR=/some/path\`. Write a \`box.toml\` and a policy, then run the box by path (\`./box-core/box run --config ./box.toml\`).

          EOF
          if [ "$LINUX_PREVIEW" = "true" ]; then
            cat >> body.md <<EOF
          ## Linux preview

          This preview does not establish security acceptance or production readiness.

          EOF
          fi
          cat >> body.md <<EOF
          ## Linux

          The Linux builds require glibc 2.34 or newer, libgcc, and a host that permits Box's namespace, mount, and syscall-filter setup. Package availability does not establish security acceptance.

          ### Manual Linux ARM64 install

          To install without the downloader, download \`box-${NEW_TAG}-linux-arm64.tar.gz\` and \`SHA256SUMS.txt\` from the assets below. In the download directory, run:

          \`\`\`sh
          awk '\$2 == "box-${NEW_TAG}-linux-arm64.tar.gz"' SHA256SUMS.txt > box-linux.sha256 &&
            test -s box-linux.sha256 &&
            sha256sum --check box-linux.sha256 &&
            mkdir -p box-core &&
            tar -C box-core -xzf box-${NEW_TAG}-linux-arm64.tar.gz &&
            ./box-core/box run --config ./box.toml
          \`\`\`

          EOF
          if [ "$PUBLISH_LINUX_X86" = "true" ]; then
          cat >> body.md <<EOF
          ### Linux x86-64

          For Amazon Linux 2023 x86-64, use \`box-${NEW_TAG}-linux-x86_64.tar.gz\`. The downloader selects this archive and verifies its checksum. Download this exact release, then start a workload:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/strands-agents/box/main/download.sh -o download-box.sh &&
            BOX_VERSION=${NEW_TAG} sh download-box.sh &&
            ./box-core/box run --config ./box.toml
          \`\`\`

          EOF
          fi
          cat >> body.md <<EOF
          ## Assets

          The macOS archive contains \`Box.app\`, a \`box\` launcher, and helper links into its signed and notarized bundle. Keep that directory intact. Linux archives contain \`box\` beside its helpers. Each \`box-cli-\` archive contains the \`box\` command, both Box Core helpers, bundled packs, and \`release.json\`, and its macOS programs are signed and notarized. \`SHA256SUMS.txt\` contains each archive's checksum.
          EOF

      - name: Tag the pinned SHA
        # Push the tag over git rather than through the releases API: that path
        # returns 403 for the GITHUB_TOKEN (cli/cli#9514); a ref push works.
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          RELEASE_SHA: ${{ needs.scan.outputs.release_sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$NEW_TAG"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.scan.outputs.new_tag }}
          name: ${{ needs.scan.outputs.new_tag }}
          target_commitish: ${{ needs.scan.outputs.release_sha }}
          draft: false
          prerelease: ${{ needs.scan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.scan.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: release/*
          body_path: body.md

      - name: Print release summary
        env:
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          RELEASE_SHA: ${{ needs.scan.outputs.release_sha }}
        run: |
          {
            echo "## strands-box ${NEW_TAG}"
            echo ""
            echo "Commit: \`${RELEASE_SHA}\`"
            echo ""
            echo "Assets:"
            for f in release/*; do
              echo "- \`$(basename "$f")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Post-publish smoke check ───────────────────────────────────────────
  verify-published:
    name: Verify release assets
    needs: [scan, release]
    if: |
      always() &&
      inputs.dry_run != true &&
      inputs.premerge_signing_test != true &&
      needs.release.result == 'success'
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Poll the release for its tag and assets
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.scan.outputs.new_tag }}
          PRERELEASE: ${{ needs.scan.outputs.prerelease }}
          PUBLISH_LINUX_X86: ${{ needs.scan.outputs.publish_linux_x86 }}
        run: |
          set -euo pipefail
          expected=(
            "box-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
            "box-${NEW_TAG}-linux-arm64.tar.gz"
            "box-cli-${NEW_TAG}-aarch64-apple-darwin.tar.gz"
            "box-cli-${NEW_TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "SHA256SUMS.txt"
          )
          if [ "$PUBLISH_LINUX_X86" = "true" ]; then
            expected+=(
              "box-${NEW_TAG}-linux-x86_64.tar.gz"
              "box-cli-${NEW_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            )
          fi
          for i in $(seq 1 30); do
            if names=$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
              missing=0
              for a in "${expected[@]}"; do
                grep -qx "$a" <<<"$names" || { echo "attempt $i/30: asset $a not present yet"; missing=1; break; }
              done
              if [ "$missing" = "0" ]; then
                actual_preview=$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
                if [ "$actual_preview" != "$PRERELEASE" ]; then
                  echo "::error::$NEW_TAG has an incorrect prerelease setting."
                  exit 1
                fi
                if [ "$(sort <<<"$names")" != "$(printf '%s\n' "${expected[@]}" | sort)" ]; then
                  echo "::error::$NEW_TAG publishes assets beyond the expected set: $(tr '\n' ' ' <<<"$names")"
                  exit 1
                fi
                echo "$NEW_TAG is published with all ${#expected[@]} assets."
                exit 0
              fi
            else
              echo "attempt $i/30: release $NEW_TAG not visible yet"
            fi
            sleep 10
          done
          echo "::error::$NEW_TAG not fully published (missing assets) after 5 minutes."
          exit 1
