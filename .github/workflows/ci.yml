name: CI

on:
  pull_request:
    branches: [main, feature/native-filesystem-core, feature/linux-native-launch-prep, feature/linux-native-kernel, feature/linux-native-operations]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      containment: ${{ steps.filter.outputs.containment }}
      verdict: ${{ steps.filter.outputs.verdict }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # `**/!(*.md)` excludes docs-only changes from the matrix; keep it an
          # extglob, not a `!**/*.md` negation (paths-filter OR-s patterns, so a
          # bare negation fires on everything).
          filters: |
            native:
              - '.cargo/**'
              - 'crates/**/!(*.md)'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'test-native-filesystem/**/!(*.md)'
              - '.github/workflows/**'
            rust:
              - 'crates/**/!(*.md)'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust-*'
              - '.github/workflows/ci.yml'
            containment:
              - 'crates/**/!(*.md)'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'test-integ/**/!(*.md)'
              # test-integ re-exports the shared decision-journal reader, so a
              # change there changes what every containment case parses.
              - 'test-common/**/!(*.md)'
              - '.github/workflows/containment-deterministic.yml'
              - '.github/workflows/ci.yml'
            verdict:
              - 'test-common/**/!(*.md)'
              - 'test-workload/verdict/**/!(*.md)'
              - 'test-workload/common/**/!(*.md)'
              - 'test-workload/workload-native-filesystem/**'
              - '.github/workflows/verdict-hermetic.yml'
              - '.github/workflows/ci.yml'

  packaging:
    name: Packaging tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: read
    permissions:
      contents: read
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check release source and archive selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  rust:
    name: Rust
    needs: detect-changes
    # On push and workflow_dispatch, detect-changes still runs but its filter
    # outputs are unset — run rust unconditionally in those cases.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust-test-lint.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  containment:
    name: Containment
    needs: detect-changes
    # Same unconditional-on-push rule as `rust`: detect-changes runs but its
    # filter outputs are unset outside a pull_request.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.containment == 'true' }}
    uses: ./.github/workflows/containment-deterministic.yml
    permissions:
      contents: read

  verdict:
    name: Verdict
    needs: detect-changes
    # Same unconditional-on-push rule as the legs above.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.verdict == 'true' }}
    uses: ./.github/workflows/verdict-hermetic.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  native:
    name: Native Filesystem
    needs: detect-changes
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.native == 'true' }}
    uses: ./.github/workflows/native-filesystem.yml
    permissions:
      contents: read

  ci-gate:
    name: CI Gate
    if: always()
    needs: [detect-changes, packaging, rust, containment, verdict, native]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: rust, containment, verdict, native
          jobs: ${{ toJSON(needs) }}
