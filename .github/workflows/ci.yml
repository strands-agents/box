name: CI

# One CI for Box Core and the box CLI. detect-changes sorts a pull request's paths into change
# classes, and each job runs for the classes that need it:
#
#   core    Box Core: everything under crates/ outside crates/cli/, and its test harnesses.
#           Runs Core's unit tests and lint (rust-test-lint.yml), containment, and the CLI's
#           Linux tests and macOS engine suite (cli-test.yml, suite `core`), because the CLI
#           builds on Core.
#   cli     The box CLI: crates/cli/, resources/, the test-corpus files its tests read, its
#           installer, and its scripts. Runs cli-test.yml (all). A CLI-only change skips Core's
#           unit tests and the containment suite.
#   release The files that build, sign, or install the release packages. A pull request runs the
#           macOS package jobs only when it changes one of them; a push to main always does.
#   shared  The workspace files both parts build from. Runs everything.
#   other   A path that no filter and no skip-list entry names. Runs everything.
#
# Every other event (push, workflow_dispatch) runs every job.

on:
  pull_request:
    branches: [main, feature/native-filesystem-core, feature/linux-native-launch-prep, feature/linux-native-kernel, feature/linux-native-operations, feature/storage-*]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      core: >-
        ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' ||
        steps.every.outputs.core_crates == 'true' || steps.filter.outputs.shared == 'true' ||
        steps.every.outputs.other == 'true' }}
      cli: >-
        ${{ github.event_name != 'pull_request' || steps.filter.outputs.cli == 'true' ||
        steps.filter.outputs.shared == 'true' || steps.every.outputs.other == 'true' }}
      site_manifest: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site_manifest == 'true' }}
      containment: >-
        ${{ github.event_name != 'pull_request' || steps.filter.outputs.containment == 'true' ||
        steps.every.outputs.core_crates == 'true' || steps.every.outputs.other == 'true' }}
      verdict: ${{ github.event_name != 'pull_request' || steps.filter.outputs.verdict == 'true' }}
      release: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # `**/!(*.md)` excludes docs-only changes. Keep these extglobs because paths-filter OR-s
          # the patterns of a filter. Core's crates are in the `every` step below.
          filters: |
            core:
              - 'test-native-filesystem/**/!(*.md)'
              - '.github/workflows/rust-*'
              - 'scripts/check-linux-test-output.py'
              - 'scripts/test_linux_test_output.py'
            cli:
              - 'crates/cli/**/!(*.md)'
              - 'resources/**'
              - 'test-corpus/**'
              # CLI incoming-mount integration tests use this Core publisher fixture.
              - 'crates/box/tests/support/incoming_mounts_probe.py'
              - 'crates/box/tests/support/namespace_launcher.rs'
              # crates/cli/app/src/profile_tests.rs reads it.
              - 'docs/cli/troubleshooting.md'
              # crates/cli/app/src/explain.rs builds it into `box explain`.
              - 'docs/user/message-codes.md'
              - '.github/workflows/cli-test.yml'
              # The CLI's scripts and their tests. resources.rs reads macos-release-cli.py.
              - 'scripts/check-prose.sh'
              - 'scripts/drive_tui.py'
              - 'scripts/macos-release-cli.py'
              - 'scripts/try-build.sh'
              - 'scripts/test_ci_workflow.py'
              - 'scripts/test_try_build.py'
              - 'install.sh'
              - 'scripts/package_macos.sh'
              - 'scripts/smoke_telemetry.py'
              - 'scripts/test_distribution.py'
              - 'scripts/test_macos_package.py'
              # A release change runs the CLI jobs, so the release filter can add the package.
              - '.github/workflows/cli-release.yml'
              - '.github/workflows/deploy-box-artifact.yml'
            release:
              - 'install.sh'
              - 'crates/cli/app/Info.plist'
              - 'crates/cli/app/build.rs'
              - '.github/workflows/cli-release.yml'
              - '.github/workflows/cli-test.yml'
              - '.github/workflows/deploy-box-artifact.yml'
              - 'scripts/package_macos.sh'
              - 'scripts/macos-release-cli.py'
              - 'scripts/smoke_telemetry.py'
              - 'scripts/test_distribution.py'
              - 'scripts/test_macos_package.py'
            shared:
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/ci.yml'
            site_manifest:
              - 'docs/site-manifest.json'
              - 'docs/site-manifest-retirements.json'
              - 'docs/user/**/*.md'
              - 'docs/cli/**/*.md'
              - 'crates/box/tests/site_manifest.rs'
              - '.github/workflows/ci.yml'
            containment:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'test-integ/**/!(*.md)'
              # test-integ re-exports the shared decision-journal reader, so a
              # change there changes what every containment case parses.
              - 'test-common/**/!(*.md)'
              # The macOS leg also runs the downloader tests.
              - 'download.sh'
              - 'scripts/test_download.py'
              - '.github/workflows/containment-deterministic.yml'
              # The macOS leg of the suite runs as steps of the unit-test job.
              - '.github/workflows/rust-test-lint.yml'
              - '.github/workflows/ci.yml'
            verdict:
              - 'test-common/**/!(*.md)'
              - 'test-workload/verdict/**/!(*.md)'
              - 'test-workload/common/**/!(*.md)'
              - 'test-workload/workload-native-filesystem/**'
              - '.github/workflows/verdict-hermetic.yml'
              - '.github/workflows/ci.yml'
      # A path must match every pattern of these filters, so they have their own step
      # (`predicate-quantifier` applies to each filter in a step).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: every
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            core_crates:
              - 'crates/**/!(*.md)'
              - '!crates/cli/**'
            other:
              - '**'
              - '!**/*.md'
              - '!.agents/**'
              - '!.cargo/**'
              - '!.claude/**'
              - '!.github/**'
              - '!.gitignore'
              - '!install.sh'
              - '!crates/**'
              - '!docs/**'
              - '!examples/**'
              - '!resources/**'
              - '!scripts/**'
              - '!team/**'
              - '!test-common/**'
              - '!test-corpus/**'
              - '!test-integ/**'
              - '!test-native-filesystem/**'
              - '!test-workload/**'
              - '!Cargo.lock'
              - '!Cargo.toml'
              - '!LICENSE'
              - '!NOTICE'
              - '!download.sh'
              - '!justfile'
              - '!rust-toolchain.toml'

  # The CLI's pages, with the same list as `just prose`. Box Core's pages join after their prose
  # cleanup.
  prose:
    name: Prose
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prose
        run: git ls-files -z 'docs/cli/*.md' 'docs/design/cli/*.md' 'resources/packs/*/README.md' 'resources/plugins/*/README.md' 'resources/policies/*/README.md' | xargs -0 scripts/check-prose.sh

  packaging:
    name: Packaging tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    cache-mode: read
    permissions:
      contents: read
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check downloader syntax
        run: sh -n download.sh
      - name: Enable private mount tests on Linux
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true
      - name: Check release source, archive selection, and downloader behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  rust:
    name: Rust
    needs: detect-changes
    # Box Core's unit tests on three runners, each in two halves, and the workspace lint, for a
    # Core change. The deterministic containment suite's macOS leg has its own macOS runner. A
    # change that only the containment filter selects runs the macOS unit-test halves alone, with
    # no Linux leg and no lint. A draft pull request skips the containment suite.
    if: ${{ needs.detect-changes.outputs.core == 'true' || (github.event.pull_request.draft != true && needs.detect-changes.outputs.containment == 'true') }}
    uses: ./.github/workflows/rust-test-lint.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      os: ${{ needs.detect-changes.outputs.core == 'true' && '["ubuntu-24.04-arm", "ubuntu-24.04", "macos-latest"]' || '["macos-latest"]' }}
      run_lint: ${{ needs.detect-changes.outputs.core == 'true' }}
      containment_macos: ${{ github.event.pull_request.draft != true && needs.detect-changes.outputs.containment == 'true' }}

  # The CLI's build, test, and lint on Linux, and the macOS checks (cli-test.yml). A Core-only
  # change runs the Linux job and only the engine suite on macOS, and a draft skips the macOS jobs.
  cli:
    name: CLI
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true' || needs.detect-changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/cli-test.yml
    with:
      suite: ${{ needs.detect-changes.outputs.cli == 'true' && 'all' || 'core' }}
      macos: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      package: ${{ needs.detect-changes.outputs.release == 'true' }}

  site-manifest:
    name: Site manifest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.site_manifest == 'true' }}
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Prepare the base publication contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_MANIFEST: ${{ runner.temp }}/base-site-manifest.json
          BASE_RETIREMENTS: ${{ runner.temp }}/base-site-manifest-retirements.json
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:docs/site-manifest.json" 2>/dev/null; then
            git show "$BASE_SHA:docs/site-manifest.json" > "$BASE_MANIFEST"
            echo "SITE_MANIFEST_BASE=$BASE_MANIFEST" >> "$GITHUB_ENV"
          fi
          if git cat-file -e "$BASE_SHA:docs/site-manifest-retirements.json" 2>/dev/null; then
            git show "$BASE_SHA:docs/site-manifest-retirements.json" > "$BASE_RETIREMENTS"
            echo "SITE_MANIFEST_RETIREMENTS_BASE=$BASE_RETIREMENTS" >> "$GITHUB_ENV"
          fi

      - name: Validate the external publication contract
        run: cargo test -p strands-box --test site_manifest --locked --all-features

  containment:
    name: Containment
    needs: detect-changes
    # A draft pull request skips this suite; `ready_for_review` starts it.
    if: ${{ github.event.pull_request.draft != true && needs.detect-changes.outputs.containment == 'true' }}
    uses: ./.github/workflows/containment-deterministic.yml
    permissions:
      contents: read

  verdict:
    name: Verdict
    needs: detect-changes
    # A draft pull request skips this suite; `ready_for_review` starts it.
    if: ${{ github.event.pull_request.draft != true && needs.detect-changes.outputs.verdict == 'true' }}
    uses: ./.github/workflows/verdict-hermetic.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  # The one check the main branch ruleset requires. A draft skips the macOS jobs and the
  # containment suites, so it never passes.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [detect-changes, prose, packaging, rust, cli, site-manifest, containment, verdict]
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: rust, cli, site-manifest, containment, verdict
          jobs: ${{ toJSON(needs) }}

      - name: Refuse a draft as merge evidence
        if: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "::error::Draft run: the macOS checks and the containment suites did not run. Mark the pull request ready to run the full suite."
          exit 1
