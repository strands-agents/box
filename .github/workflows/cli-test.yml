name: "CLI: Test"

# The CLI's test jobs: build, test, and lint on Linux, every macOS check in one job (the corpus's
# launch checks included), and the macOS package. A reusable workflow (`workflow_call`): ci.yml calls
# it, and the release workflow calls it to gate a release. Every job tests `ref`, or the commit that
# triggered the caller (`github.sha`) when `ref` is empty.
#
# `suite` picks what runs:
#   all     every job below.
#   engine  the engine suite (crates/cli/app/tests/engine.rs) on macOS only.

on:
  workflow_call:
    inputs:
      suite:
        description: "all or engine."
        required: false
        type: string
        default: all
      macos:
        description: "Run the macOS jobs. ci.yml sets it false for a draft pull request."
        required: false
        type: boolean
        default: true
      package:
        description: "Build the macOS package and run it on each supported macOS."
        required: false
        type: boolean
        default: false
      ref:
        description: "The commit to test. Empty tests github.sha."
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  # Drop DWARF: the dev profile (which cargo test inherits) can push target/ over the runner's disk.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  check-suite:
    name: Check the suite input
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an unknown suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            all|engine) ;;
            *) echo "::error::unknown suite: $SUITE"; exit 1 ;;
          esac

  build-test-lint:
    # A fixed name, so the check's name does not change with the runner label.
    name: Build, test, lint
    needs: check-suite
    if: inputs.suite == 'all'
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner == 'strands-agents' && 'strands-agents_ubuntu-latest_4-core' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    # The host tests on Linux x86_64, including the telemetry tests that start a real box. The
    # `macos` job runs them on macOS, with the engine suite: CI runs the engine suite only on macOS.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # Ubuntu 24.04's AppArmor default refuses the user namespaces a box needs.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --all-features -p strands-box-cli -p strands-box -p strands-box-containment --bin box --bin strands-box --bin strands-box-sock-alias --bin strands-box-contain-trampoline

      # The CLI's packages only: Box Core's tests run in rust-test-lint.yml.
      - name: Test
        run: cargo test -p strands-box-cli -p strands-box-cli-pack-tests -p strands-box-cli-profile -p strands-box-cli-telemetry --all-features

  # Every macOS check in one job, so a pull request waits for one macOS runner. The corpus and
  # launch checks run the build without test-support. The host tests and the engine suite run last,
  # because they rebuild box with it.
  macos:
    name: macOS checks
    needs: check-suite
    if: inputs.macos
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 60
    # The agents the launch checks start, pinned. To add one, add its check to
    # test-corpus/launch.toml and its program to the "Install the agents" step.
    env:
      # The checks' runs send no telemetry.
      BOX_TELEMETRY: "0"
      CLAUDE_CODE_VERSION: "2.1.316"
      CLAUDE_CODE_SHA256: 64c327e92b2c5e0f78c0a980c5a518121e1f0d140ca771ca5dd4488d1a2dcb3f
      CODEX_VERSION: "0.166.0"
      CODEX_SHA256: c48824462fc57681eafb0925d97b11b589010475613904f570b42fea53e240d5
      # Kiro's installer checks the package against the SHA-256 in Kiro's own release index, and the
      # job checks the installer against this SHA-256. A new installer script fails the check until
      # this changes.
      KIRO_CLI_VERSION: "3.4.0"
      KIRO_INSTALL_SHA256: a8bce4c6b740deb61009e3ad10995ec3027a51e6345025f1a2e5048ffdbf4b84
      # The `engine` suite skips the corpus and launch checks.
      LAUNCH: ${{ inputs.suite == 'all' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build Box and helpers
        id: build
        run: cargo build --locked -p strands-box-cli -p strands-box -p strands-box-containment --bin box --bin strands-box --bin strands-box-sock-alias --bin strands-box-contain-trampoline

      # The test build that scripts/try-build.sh downloads. A tarball keeps the execute bits that
      # the artifact zip drops.
      - name: Pack the test build
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          build="$RUNNER_TEMP/box-build"
          mkdir -p "$build"
          cp target/debug/box target/debug/strands-box-sock-alias target/debug/strands-box-contain-trampoline "$build/"
          cp -R resources "$build/resources"
          # Without this, macOS tar adds a ._ file for each extended attribute.
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/box.tar.gz" -C "$build" .

      - name: Upload the test build
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: box-${{ github.event.pull_request.head.sha || github.sha }}-aarch64-apple-darwin
          path: ${{ runner.temp }}/box.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      # The probe launch check: the box starts.
      - name: Corpus launch check
        id: launch-check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.LAUNCH == 'true' }}
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python3 test-corpus/run_corpus.py --layer launch --ids probe --install-profiles \
            --timeout 60 --out "$RUNNER_TEMP/corpus-out"

      - name: Upload the launch check results
        if: ${{ !cancelled() && steps.launch-check.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-launch-check-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/corpus-out
          if-no-files-found: warn
          retention-days: 14

      - name: Corpus runner unit tests
        if: ${{ !cancelled() && env.LAUNCH == 'true' }}
        run: python3 -m unittest discover -s test-corpus -p 'test_*.py'

      # Each agent's native program, where its own installer puts it: the box cannot start an npm
      # launcher (docs/cli/troubleshooting.md). Only the launch checks put it on PATH.
      - name: Install the agents
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.LAUNCH == 'true' }}
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin" "$HOME/.local/share/claude/versions"
          claude="$HOME/.local/share/claude/versions/$CLAUDE_CODE_VERSION"
          curl -fsSL -o "$claude" "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/darwin-arm64/claude"
          echo "$CLAUDE_CODE_SHA256  $claude" | shasum -a 256 -c -
          chmod 755 "$claude"
          ln -sf "$claude" "$bin/claude"
          curl -fsSL -o "$RUNNER_TEMP/codex.tar.gz" "https://github.com/openai/codex/releases/download/rust-v$CODEX_VERSION/codex-aarch64-apple-darwin.tar.gz"
          echo "$CODEX_SHA256  $RUNNER_TEMP/codex.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/codex-aarch64-apple-darwin" "$bin/codex"
          curl -fsSL -o "$RUNNER_TEMP/kiro-install.sh" https://cli.kiro.dev/install
          echo "$KIRO_INSTALL_SHA256  $RUNNER_TEMP/kiro-install.sh" | shasum -a 256 -c -
          bash "$RUNNER_TEMP/kiro-install.sh" --version "$KIRO_CLI_VERSION" --force --no-modify-path
          # The box runs Kiro's runtime only from a folder it cannot write (resources/packs/kiro/README.md).
          # Kiro CLI refuses to start a chat until it has a login or a key. Listing sessions makes no
          # model call, so a stand-in key is enough.
          KIRO_API_KEY=ksk_placeholder-no-model-call KIRO_RUNTIME_DIR="$HOME/.kiro-runtime" \
            "$bin/kiro-cli" --v3 chat --list-sessions

      # Each check's result must match its expect in test-corpus/launch.toml (test-corpus/README.md).
      - name: Launch checks
        id: launch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.LAUNCH == 'true' }}
        run: |
          export PATH="$PWD/target/debug:$HOME/.local/bin:$PATH"
          claude --version
          codex --version
          kiro-cli --version
          python3 test-corpus/run_corpus.py --layer launch --install-profiles --no-skip \
            --timeout 120 --out "$RUNNER_TEMP/launch-out"

      - name: Upload the launch check results
        if: ${{ !cancelled() && steps.launch.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/launch-out
          if-no-files-found: warn
          retention-days: 14

      - name: Install fish for installer tests
        if: ${{ !cancelled() && inputs.suite == 'all' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install fish

      - name: Distribution scripts
        if: ${{ !cancelled() && inputs.suite == 'all' }}
        run: |
          sh -n install.sh scripts/package_macos.sh
          python3 scripts/test_distribution.py

      # Lint runs after the checks, so a lint failure does not skip them. Format runs on Linux only.
      - name: Clippy
        if: ${{ !cancelled() && inputs.suite == 'all' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install launcher test prerequisites
        if: ${{ !cancelled() }}
        run: |
          brew install uv python
          launcher_node_bin="$(dirname "$(command -v node)")"
          launcher_brew_bin="$(brew --prefix)/bin"
          export PATH="$launcher_node_bin:$launcher_brew_bin:$PATH"
          npm install --global npm@10.9.7
          npm install --global pnpm@10.34.9 bun@1.4.4
          # crates/cli/app/tests/pi_box_shell.rs runs @box/pi's extension in the pi that the pack names.
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          printf '%s\n' "$launcher_brew_bin" "$launcher_node_bin" >> "$GITHUB_PATH"
          node --version
          npm --version
          command -v npx uvx bunx pnpx python3 node pi

      # The host tests and the engine suite (crates/cli/app/tests/engine.rs). The test-support build
      # of box replaces the one the checks above ran. The engine suite runs Apple's /usr/bin/git
      # stub, so the step refuses a runner that does not select full Xcode.
      - name: Test
        if: ${{ !cancelled() }}
        env:
          BOX_REQUIRE_PI: "1"
          SUITE: ${{ inputs.suite }}
        run: |
          developer_dir="$(xcode-select -p)"
          case "$developer_dir" in
            *.app/Contents/Developer) echo "developer folder: $developer_dir" ;;
            *) echo "::error::full Xcode is not selected: $developer_dir"; exit 1 ;;
          esac
          if [ "$SUITE" = engine ]; then
            cargo test -p strands-box-cli --all-features --test engine
          else
            cargo test -p strands-box-cli -p strands-box-cli-pack-tests -p strands-box-cli-profile -p strands-box-cli-telemetry --all-features
          fi

  # The macOS package, built as the release builds it, then run on each supported macOS.
  package:
    name: Build macOS package
    needs: check-suite
    if: inputs.macos && inputs.package && inputs.suite == 'all'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check build host
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build archive
        run: |
          set -o pipefail
          sh scripts/package_macos.sh "$RUNNER_TEMP/distribution" 2>&1 | tee "$RUNNER_TEMP/package-build.log"

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-build-log
          path: ${{ runner.temp }}/package-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Save unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: ${{ runner.temp }}/distribution/
          if-no-files-found: error
          retention-days: 7

      - name: Save package test and expected source inputs
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-test
          path: |
            scripts/test_macos_package.py
            scripts/smoke_telemetry.py
            install.sh
            crates/cli/app/Cargo.toml
            Cargo.lock
            resources/config.toml
            resources/editing-box-profile.md
            resources/packs/
            resources/plugins/
            resources/policies/
            resources/starters/
          if-no-files-found: error
          retention-days: 7

  verify-package:
    name: Run macOS package (${{ matrix.os }})
    needs: package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: ${{ runner.temp }}/distribution

      - name: Download package test and expected source inputs
        uses: actions/download-artifact@v4
        with:
          name: macos-package-test
          path: ${{ runner.temp }}/package-test

      - name: Verify and run package
        working-directory: ${{ runner.temp }}
        env:
          BOX_TEST_INSTALLATION_ID: ${{ vars.BOX_TEST_INSTALLATION_ID }}
          # The package job checks out this commit, so release.json records it.
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          set -o pipefail
          caller_home="$RUNNER_TEMP/package-test-home"
          mkdir -p "$caller_home/.strands/box"
          python3 -c 'import json, os; print("installation_id = " + json.dumps(os.environ.get("BOX_TEST_INSTALLATION_ID", "")))' \
            > "$caller_home/.strands/box/installation.toml"
          HOME="$caller_home" python3 "$RUNNER_TEMP/package-test/scripts/test_macos_package.py" \
            "$RUNNER_TEMP/distribution/"*.tar.gz "$SOURCE_SHA" 2>&1 | tee "$RUNNER_TEMP/package-verification.log"

      - name: Save verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-verification-${{ matrix.os }}
          path: ${{ runner.temp }}/package-verification.log
          if-no-files-found: error
          retention-days: 7
