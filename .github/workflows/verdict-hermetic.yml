name: "Verdict: Hermetic"

# The verdict layer's own unit tests: `test-common/` (the shared decision-journal
# reader) and `test-workload/verdict/` (the Rust rules that judge an agent-driven
# run).
#
# Why these run free on `pull_request` while the suite they serve does not:
# `test-workload/`'s suite needs two EC2 instances, a Dedicated Mac host, an S3
# ledger, and a live model call per cell, so it sits behind a maintainer approval
# gate in workload-suite.yml. These crates need NONE of that. Every test here is a
# pure function over synthetic JSON fixtures -- no network, no credentials, no
# model, no box binary, no cage. So gating them would only mean that a PR which
# changes the verdict rule gets no automatic signal on whether the rule still
# holds, which is the one thing worth checking on every push.
#
# The split is by RESOURCE REQUIREMENT, not by directory: hermetic tests run
# always, cloud runs are approved.
#
# These are BLOCKING, like the unit tests in rust-test-lint.yml. A false PASS in a
# verdict rule reports containment that was never measured, so a regression here
# must stop the merge.
#
# Shape: a reusable workflow (`workflow_call`) called from ci.yml, so branch
# protection keeps requiring a single CI Gate status.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Same disk-pressure guard as the other Rust legs: full DWARF on the dev profile
  # has overflowed a hosted runner's ~14 GB free.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  verdict:
    name: Verdict (hermetic)
    permissions:
      contents: read
    # One runner, not a matrix. Nothing here is platform-conditional except
    # `default_platform()` in the oracle binary, which is a two-arm `cfg!` over the
    # row's own label and is not what these tests exercise. The deterministic suite
    # covers the per-OS behaviour; duplicating this leg would buy a second copy of
    # the same pure-function result.
    runs-on: ubuntu-latest
    # Minutes, not tens of minutes: no box build, no cage, no subprocess. The cap
    # exists to catch a wedge, not to budget for real work.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Pinned by rust-toolchain.toml, which both crates inherit. Named here so
      # the log records which toolchain resolved rather than leaving it implicit.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: verdict-hermetic
          # Restore on every run, but only WRITE a cache entry on a push to the
          # default branch. Steps after this one execute code from `inputs.ref`, so
          # if they could also write a cache entry, a run could poison a cache that
          # later trusted builds restore (CodeQL
          # `actions/cache-poisoning/poisonable-step`). The `event_name == 'push'`
          # half matters on its own: a `workflow_dispatch` on `main` also satisfies
          # the ref check and runs privileged, which is the path that rule names.
          # Same guard as containment-deterministic.yml.
          #
          # CodeQL evaluates the workflow statically and cannot see through this
          # expression, so the alerts on the steps below persist. They are the same
          # shape as the ones already open against rust-test-lint.yml and
          # deploy-box-artifact.yml: a test workflow exists to build and run the
          # proposed code, so "do not execute untrusted code" is not available to it.
          # What IS available is denying that code any way to write the cache.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Both crates are excluded from the root workspace and carry their own
          # lockfiles, so the cache must cover both target directories.
          workspaces: |
            test-common
            test-workload/verdict

      # Run each crate's full gate separately. They are separate Cargo packages
      # with separate lockfiles (excluded from the root workspace in Cargo.toml),
      # so there is no one `--workspace` invocation that covers both.
      - name: test-common — fmt, clippy, test
        working-directory: test-common
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features --verbose

      - name: test-workload/verdict — fmt, clippy, test
        working-directory: test-workload/verdict
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features --verbose
