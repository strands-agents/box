[package]
name = "strands-box-diagnostics"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Strands box's stderr messages: one line format, the message codes, and a parser (docs/design/decisions.md#core-writes-stderr-only-through-diag-and-codes-each-kind)."

[lib]
name = "diagnostics"
path = "src/lib.rs"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
print_stderr = "warn"
