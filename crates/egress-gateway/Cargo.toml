[package]
name = "strands-box-egress-gateway"
version = "0.1.0"
edition = "2024"
publish = false
description = "The egress gateway — the outbound boundary of the zero-trust box. Provides mechanism controls, credential injection, and a domain-owned effect-interception seam."

[lib]
name = "egress_gateway"
path = "src/lib.rs"

[features]
# TLS interception (the MITM adapter: `MitmConfig`, `MitmHandle`, `MitmInterceptor`,
# `ResponseLimits`) is a DEFAULT-ON cargo feature scoped to Part A only (never
# Part B). With it off the crate builds with no adapter. The feature pulls in the
# TLS stack (rustls + ring for the ephemeral CA); the socket-free Part B never
# touches them.
default = ["tls-intercept"]
tls-intercept = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:ring",
    "dep:rcgen",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
# The credential vault (mint half). This is the ONE-WAY dependency the mint/inject
# split rests on: the proxy *injects* the secret, `credentials` *mints* it
# and owns the `RequestId` shared by their audit records. `credentials` must never
# depend back on this crate (nor on `policy`).
strands-box-credentials = { path = "../credentials" }

# Fail-closed, typed error model — same pattern as the sibling crates.
thiserror = "2"

# Secret hygiene: the Real_Secret and the ephemeral CA private key live in
# `Zeroizing` so plaintext is wiped on drop; never logged, never disked.
zeroize = { version = "1", features = ["derive"] }

# Base64 for BasicAuth credential injection (`Authorization: Basic <base64>`).
base64 = { version = "0.23", default-features = false, features = ["std"] }

# JSON-RPC frame classification for both kinds of MCP server (identifiers only — no body is retained).
serde_json = "1"

# RFC 3986 parsing and normalization of request paths and MCP resource URIs before they are judged.
fluent-uri = { version = "=0.4.1", default-features = false, features = ["alloc"] }

# ------------------------------------------------------------------------------
# tls-intercept-only deps (Part A / MITM adapter). Optional so `--no-default-features`
# builds a tunnel-only MITM with none of the TLS stack compiled in.
# ------------------------------------------------------------------------------
# The TLS terminator (server side to the workload, client side to the upstream).
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", optional = true }
# System-root trust anchors for the upstream (client) side of interception.
webpki-roots = { version = "1", optional = true }
# ECDSA P-256 keygen + signing for the ephemeral CA and per-host leaf minting.
ring = { version = "0.17", optional = true }
# X.509 cert generation for the ephemeral CA + per-host leaves (ring backend, matching rustls).
rcgen = { version = "0.14", optional = true, default-features = false, features = ["ring", "pem"] }
# The gateway's own multi-thread runtime: the accept loop, the connection slots, the stop signal,
# and the first head of each connection.
tokio = { version = "1", optional = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# TLS on the gateway runtime, on both legs. The default features pull `aws-lc-rs`, which is not in
# `Cargo.lock`; `ring` matches `rustls` above.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
# The HTTP/1.1 server toward the workload and the client toward the upstream. The `tracing` feature
# stays off, so hyper never logs a head.
hyper = { version = "1", optional = true, features = ["client", "http1", "server"] }
# The tokio adapters (`TokioIo`, `TokioTimer`) that hyper needs on the gateway runtime.
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
# The body limit (`Limited`) and the body collection on both legs.
http-body-util = { version = "0.1", optional = true }
# The owners of the forwarded header values and target, which are wiped on drop.
bytes = { version = "1", optional = true }

[dev-dependencies]
# The full-interception E2E stands up a real TLS upstream and a real TLS workload client (both
# trusting the ephemeral CA) so a request is genuinely intercepted end-to-end over TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The runtime tests start and drop the adapter inside a caller's runtime of each flavor.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
