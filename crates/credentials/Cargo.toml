[package]
name = "strands-box-credentials"
version = "0.1.0"
edition = "2024"
publish = false
description = "The credential vault: resolves each real secret and attaches it to an outbound request at the network boundary, so the workload never holds it. The box and its egress gateway use it."

[lib]
name = "credentials"
path = "src/lib.rs"

[dependencies]
# Secret hygiene: secret-bearing types are Zeroize/Zeroizing and wiped on
# drop; `zeroize` is the foundational dependency the whole crate is built around.
zeroize = { version = "1", features = ["derive"] }
# Fail-closed, typed error model shared by the workspace crates.
thiserror = "2"

# AWS SigV4 signing. We hand-roll the SigV4 canonical-request /
# string-to-sign / signing-key pipeline against these two pure-Rust primitives
# rather than pull the full AWS SDK: the signer must be synchronous and run
# in-boundary (the proxy invokes it), and hand-rolling keeps it dependency-light,
# deterministic, and testable against the published AWS `get-vanilla` vector with
# no async runtime. `hmac`/`sha2` are the RustCrypto primitives the SDK's own
# `aws-sigv4` uses under the hood.
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4.3"
# HTTP Basic encoding for the `BasicAuth` inject mode, and the decode half for reading a
# phantom back out of a Basic `Authorization` header. Moved here from
# `egress-proxy` with the request legs: the vault now performs the attach itself.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# The `credsd` credential source speaks line-delimited JSON-RPC 2.0 over a Unix domain socket.
# `serde`/`serde_json` build the one `credential/get` request and parse its one
# response.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The AWS SDK default credential provider chain, for a bare `aws://` reference. `aws-config`
# resolves the chain (environment, profile files including `credential_process`, web identity, the
# container endpoint, and instance metadata) and `aws-credential-types` is the resolved-credentials
# shape. `aws-smithy-http-client` is the HTTP/TLS stack the chain reaches the container endpoint and
# instance metadata over, pinned to the `ring` crypto provider so rustls has one unambiguous
# provider. `tokio` is the current-thread runtime the worker thread drives the async chain on.
# `default-features = false` keeps the default hyper client and SSO out; `credentials-process`
# turns on the `credential_process` provider and `rt-tokio` supplies the Tokio sleep.
aws-config = { version = "1", default-features = false, features = [
    "credentials-process",
    "rt-tokio",
] }
aws-credential-types = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
zeroize = "1"

# NOTE: the OAuth2 HTTP client (e.g. reqwest) is intentionally NOT declared — it is a heavy,
# framework-specific dependency with no consumer until the OAuth2 mint story
# (per the "unused deps are not added preemptively" rule). An OAuth2 client stays out.
#
# The AWS provider chain used to stay behind the injectable provider seam too, so no HTTP client or
# async runtime linked into this crate. That changed with the bare-`aws://` default chain: the SDK
# (`aws-config`), an async runtime (`tokio`), and a TLS stack (`aws-smithy-http-client` on `ring`)
# now link into the crate, declared above. The reason is cohesion: this crate already owns every
# other AWS credential path, so the default chain belongs beside the profile path rather than in a
# second crate that injects a resolver across a seam. The cost is a larger dependency surface in the
# one process that holds every resolved plaintext, and SDK-held session credentials living in its
# defended but un-wiped heap between requests.
