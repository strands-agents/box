[package]
name = "strands-box-credentials"
version = "0.1.0"
edition = "2024"
publish = false
description = "The credential vault: resolves each real secret and attaches it to an outbound request at the network boundary, so the workload never holds it. The box and its egress gateway use it."

[lib]
name = "credentials"
path = "src/lib.rs"

[dependencies]
# Secret hygiene: secret-bearing types are Zeroize/Zeroizing and wiped on
# drop; `zeroize` is the foundational dependency the whole crate is built around.
zeroize = { version = "1", features = ["derive"] }
# Fail-closed, typed error model shared by the workspace crates.
thiserror = "2"

# AWS SigV4 signing. We hand-roll the SigV4 canonical-request /
# string-to-sign / signing-key pipeline against these two pure-Rust primitives
# rather than pull the full AWS SDK: the signer must be synchronous and run
# in-boundary (the proxy invokes it), and hand-rolling keeps it dependency-light,
# deterministic, and testable against the published AWS `get-vanilla` vector with
# no async runtime. `hmac`/`sha2` are the RustCrypto primitives the SDK's own
# `aws-sigv4` uses under the hood.
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4.3"
# HTTP Basic encoding for the `BasicAuth` inject mode, and the decode half for reading a
# phantom back out of a Basic `Authorization` header. Moved here from
# `egress-proxy` with the request legs: the vault now performs the attach itself.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# The `credsd` credential source speaks line-delimited JSON-RPC 2.0 over a Unix domain socket.
# `serde`/`serde_json` build the one `credential/get` request and parse its one
# response. See the NOTE below on why an HTTP client is still absent: the socket transport is
# `std::os::unix::net`, so no async runtime or TLS stack enters this process.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zeroize = "1"

# NOTE: the OAuth2 HTTP client (e.g. reqwest) is intentionally NOT declared yet — it is a heavy,
# framework-specific dependency with no consumer until the OAuth2 mint story
# (per the "unused deps are not added preemptively" rule). The AWS provider chain
# (profile files, SSO/STS refresh cache, instance metadata) similarly stays behind
# the injectable provider seam until the SDK-backed provider story lands.
#
# `ureq` and `serde_json` were declared above and removed on 2026-08-09: the
# OAuth2 provider they served was deleted on 2026-08-07, leaving zero call sites
# in `src/` or `tests/`. `serde_json` returned on 2026-08-31 with a call site — the
# `credsd` source's `credential/get` request and response. `ureq` stays out: an
# HTTP client compiled into this crate is not neutral — it links `rustls` and `flate2`
# into the one process that holds every resolved plaintext, so it widens the daemon's
# memory surface for no caller. Re-add it only with the call site in the same change.
