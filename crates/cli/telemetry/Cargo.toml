[package]
name = "strands-box-cli-telemetry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Telemetry payloads for the Strands Box product CLI."

[features]
test-transport = []

[dependencies]
getrandom = "0.4"
nix = { version = "0.28", features = ["fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
toml = "1"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

[lints.rust]
unused_must_use = "deny"
