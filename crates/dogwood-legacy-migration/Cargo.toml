[package]
name = "strands-box-dogwood-legacy-migration"
version = "0.1.0"
edition = "2024"
publish = false
description = "Private Dogwood 1.0 migration compiler and scratch-store validator"

[workspace]

[[bin]]
name = "strands-box-dogwood-1-0-migrate"
path = "src/main.rs"

[dependencies]
cedar-policy = "=4.11.0"
dogwood-language = "=1.0.0"
dogwood-local-engine = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"
