# Draft pack for cargo (checked against cargo 1.98 `--help` and behaviour).
# Keys beyond design.md section 3 are marked "EXT-n"; crates/policy/src/pack/grammar.rs reads them.
#
# Only `--locked` and `--frozen` stop a lockfile write. `--offline` alone does not: cargo can
# still resolve from the local cache and rewrite Cargo.lock. `--offline` removes `network`.
# CARGO_NET_OFFLINE, `net.offline` in a config file, and `[alias]` entries in
# `.cargo/config.toml` are invisible to the parser (L1). A config-file alias can redefine
# `t` to mean `publish`: see cargo.corpus.md.

format  = 1       # The pack file language. Box reads 1.
version = 1       # The major version of this pack.
pack    = "cargo"
program = "cargo"

[effects]
update_lockfile   = "Can create or rewrite Cargo.lock"
modify_manifest   = "Rewrites a Cargo.toml"
network           = "Can download from a registry or a git source"
run_build_scripts = "Compiles and runs build scripts and proc macros"
execute_built_code = "Runs a binary or test that the build produced"
install_binary    = "Installs a binary into the cargo install root"
publish_crate     = "Uploads a crate to a registry"
modify_sources    = "Rewrites source files"
override_config   = "Overrides cargo configuration for this one command"

# EXT-3. The rustup toolchain selector `+<toolchain>` is a usage token (EXT-8), not an
# option. clap marks every option below as global except -C, so they may also follow the
# subcommand (`anywhere = true`).
[global]
options.verbose   = { flag = ["-v", "--verbose"], anywhere = true }
options.quiet     = { flag = ["-q", "--quiet"], anywhere = true }
options.color     = { flag = ["--color"], value = "required", anywhere = true }
options.locked    = { flag = ["--locked"], anywhere = true, removes = ["update_lockfile"] }
options.offline   = { flag = ["--offline"], anywhere = true, removes = ["network"] }
options.frozen    = { flag = ["--frozen"], anywhere = true, removes = ["update_lockfile", "network"] }
options.config    = { flag = ["--config"], value = "required", repeated = true, anywhere = true, adds = ["override_config"] }
options.unstable  = { flag = ["-Z"], value = "required", repeated = true, anywhere = true }
options.directory = { flag = ["-C"], value = "required" }

# ---------------------------------------------------------------- shared shape
# Every build-like action repeats this option block. TOML has no include, and the design
# keeps a pack to one flat file, so the duplication is deliberate.

# ---------------------------------------------------------------- test
[shell.test]
usage   = "cargo [+<toolchain>] [global options] test [options] [<testname>] [-- <test_args>...]"
aliases = ["t"]                                                           # EXT-1 (plan Q6)
adds    = ["update_lockfile", "network", "run_build_scripts", "execute_built_code"]   # EXT-2
options.no_run        = { flag = ["--no-run"], removes = ["execute_built_code"] }
options.no_fail_fast  = { flag = ["--no-fail-fast"] }
options.package       = { flag = ["-p", "--package"], value = "required", repeated = true }
options.workspace     = { flag = ["--workspace", "--all"] }
options.exclude       = { flag = ["--exclude"], value = "required", repeated = true }
options.lib           = { flag = ["--lib"] }
options.bins          = { flag = ["--bins"] }
options.bin           = { flag = ["--bin"], value = "required", repeated = true }
options.examples      = { flag = ["--examples"] }
options.example       = { flag = ["--example"], value = "required", repeated = true }
options.tests         = { flag = ["--tests"] }
options.test          = { flag = ["--test"], value = "required", repeated = true }
options.benches       = { flag = ["--benches"] }
options.bench         = { flag = ["--bench"], value = "required", repeated = true }
options.all_targets   = { flag = ["--all-targets"] }
options.doc           = { flag = ["--doc"] }
options.features      = { flag = ["-F", "--features"], value = "required", repeated = true }
options.all_features  = { flag = ["--all-features"] }
options.no_default_features = { flag = ["--no-default-features"] }
options.release       = { flag = ["-r", "--release"] }
options.profile       = { flag = ["--profile"], value = "required" }
options.target        = { flag = ["--target"], value = "required", repeated = true }
options.target_dir    = { flag = ["--target-dir"], value = "required" }
options.jobs          = { flag = ["-j", "--jobs"], value = "required" }
options.manifest_path = { flag = ["--manifest-path"], value = "required" }
options.message_format = { flag = ["--message-format"], value = "required", repeated = true }
options.timings       = { flag = ["--timings"] }
options.keep_going    = { flag = ["--keep-going"] }
options.ignore_rust_version = { flag = ["--ignore-rust-version"] }
options.future_incompat_report = { flag = ["--future-incompat-report"] }
operands.testname  = {}
operands.test_args = {}

