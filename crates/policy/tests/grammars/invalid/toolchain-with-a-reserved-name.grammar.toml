# expect: `<grammar>.shell.test`: field "args" has a name that the schema gives every action
# A tool grammar for cargo whose toolchain selector takes a name the schema gives every action.

name    = "cargo"
program = "cargo"
format  = 1
version = 1

[shell.test]
usage = "cargo [+<args>] test [options]"
options.release = { flag = ["-r", "--release"] }
