[package]
name = "strands-box-telemetry"
version = "0.1.0"
edition = "2024"
publish = false
description = "The box's own decision records, one lane per box."

[lib]
name = "telemetry"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
# `O_NOFOLLOW` on the file target's open, so a planted link cannot redirect the audit trail.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same parser `reqwest` dials with, so the loopback exemption cannot disagree with the request.
url = "2"
zeroize = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync"] }
# The OTLP schema, generated by the OpenTelemetry project.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
    "gen-tonic-messages",
    "with-serde",
    "logs",
    "metrics",
    "trace",
] }
opentelemetry = { version = "0.33", default-features = false, features = ["logs", "trace"] }
# The queue, the batching, the drop count and the bounded flush. `rt-tokio` and the experimental
# processor put them on this crate's own runtime, so an async exporter needs no second HTTP stack.
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "logs",
    "trace",
    "rt-tokio",
    "experimental_logs_batch_log_processor_with_async_runtime",
] }
# The HTTP server for the agent's own OTLP port. Framing, keep-alive, chunked bodies and a body cap
# are the library's; this crate keeps only the strip and the stamp.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7", default-features = false, features = ["timeout"] }
prost = "0.14"
# The same spec the vendored shell declares, so the graph keeps one `reqwest`.
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unused_must_use = "deny"
